name: Temporary Phase 1 TALK Verification

on:
  push:
    branches:
      - feature/phase1-talk-local-guide-fix

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Build production bundle
        run: npm run build
