name: Human GM Chapter 1 Playtest Deploy

on:
  push:
    branches:
      - temp/weed-goblins-human-playtest-1-3-20260809

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_PROXY_SECRET: ${{ secrets.WEED_GOBLINS_STAGING_PROXY_SECRET }}
      PLAYTEST_URL: https://my420journal-wg-playtest-1-3.casevoice-ai.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/weed-goblins-human-playtest-1-3-20260809
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify protected feature branch is still untouched
        shell: bash
        run: |
          git fetch origin feature/weed-goblins-session-zero
          test "$(git rev-parse origin/feature/weed-goblins-session-zero)" = "a9021d750698d2b9b211cf3227dca676fe1da11b"

      - name: Apply full-opening Human GM prose candidate in runner only
        shell: bash
        run: |
          python .playtest/apply_human_gm_prose_v3.py
          git diff --check
          echo 'Runner-only product changes:'
          git diff --name-only | grep -v '^\.playtest/' | grep -v '^\.github/' || true

      - name: Build private playtest
        run: |
          npm ci
          npm run build
          rm -f dist/_redirects

      - name: Deploy revised Chapter 1 narration to staging Worker only
        working-directory: server/weed-goblins-narration-worker
        run: npx wrangler@latest deploy --env staging

      - name: Set private playtest proxy secret
        shell: bash
        run: printf '%s' "$STAGING_PROXY_SECRET" | npx wrangler@latest secret put WEED_GOBLINS_PROXY_SECRET --config .playtest/host/wrangler.jsonc

      - name: Deploy private playtest host
        run: npx wrangler@latest deploy --config .playtest/host/wrangler.jsonc

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify full opening and first playable scene at 390x844
        shell: bash
        run: |
          mkdir -p .validation
          cat > .validation/full-opening-v3.mjs <<'EOF'
          import { chromium } from 'playwright'

          const base = process.env.PLAYTEST_URL
          const check = (condition, message) => { if (!condition) throw new Error(message) }
          const browser = await chromium.launch({ headless: true })
          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
            await page.goto(base + '/', { waitUntil: 'networkidle' })
            await page.getByRole('button', { name: /Chapter 1/ }).click()
            await page.waitForURL('**/games/weed-goblins')

            await page.getByText(/All right\. Here's where we're starting/i).waitFor({ timeout: 15000 })
            await page.getByText(/same goblins who stole .* from you earlier today/i).waitFor()
            await page.getByText(/I'm Eliza\. I'll run the world, the goblins/i).waitFor()
            await page.getByText(/If you've never played a tabletop game like this before/i).waitFor()
            await page.getByText(/if something needs a roll, I'll stop and tell you what matters/i).waitFor()

            let body = await page.locator('body').innerText()
            check(!body.includes("Hey. I'm Eliza. I'm running this one."), 'obsolete two-message opening returned')
            check(!body.includes('For now, picture a road disappearing into wet grass'), 'obsolete clipped opening returned')
            check(!body.includes('bribe a suspicious shrub'), 'old forced-whimsy copy returned')
            check(body.includes("King's Stash Hall"), 'story objective location missing from opening')
            check(body.includes("you're here to get your stuff back"), 'theft objective missing from opening')

            const incomingBeforeContinue = await page.locator('.weed-goblins-game__message--incoming').count()
            check(incomingBeforeContinue >= 7, `expected full narrative opening, got ${incomingBeforeContinue} incoming bubbles`)
            await page.screenshot({ path: '.validation/chapter1-full-opening-v3.png', fullPage: true })

            await page.getByRole('button', { name: 'Continue' }).click()
            const composer = page.locator('.weed-goblins-game__composer input')
            await composer.waitFor()
            await composer.fill('Fenna')
            await page.locator('.weed-goblins-game__send-button').click()
            await page.getByText('Fenna. Got it.', { exact: true }).waitFor()
            await page.getByText(/What are you playing: human, dwarf, elf, or gnome/i).waitFor()

            await page.getByRole('button', { name: 'Human' }).click()
            await page.getByRole('button', { name: 'Sword' }).click()
            await page.getByRole('button', { name: 'Highland Tracker' }).click()
            await page.getByRole('button', { name: 'They' }).click()
            await page.locator('.weed-goblins-game__quick-reply').first().click()

            await page.getByText(/Back on the trail, the goblin tracks drop toward Rattlebridge/i).waitFor()
            await page.getByText(/goblin-shaped shadow ducks behind a post/i).waitFor()
            body = await page.locator('body').innerText()
            check(!/I resolve|I process|I interpret|written down|input received/i.test(body), 'machine voice present')

            await page.getByRole('button', { name: /Quiet Crossing/ }).click()
            await page.getByText(/this one's risky\. Defense check, DC 12/i).waitFor()
            const roll = page.getByRole('button', { name: /ROLL D20/i })
            await roll.waitFor()
            await roll.click()
            await page.waitForTimeout(1200)
            body = await page.locator('body').innerText()
            check(!/I resolve|I process|I interpret/i.test(body), 'machine voice appeared after roll')

            const overflow = await page.evaluate(() => ({ width: innerWidth, scrollWidth: document.documentElement.scrollWidth }))
            check(overflow.scrollWidth <= overflow.width + 1, `horizontal overflow: ${JSON.stringify(overflow)}`)
            console.log(JSON.stringify({
              FULL_OPENING_V3: 'PASS',
              incomingBeforeContinue,
              characterSetup: 'PASS',
              rattlebridge: 'PASS',
              firstD20: 'PASS',
              overflow,
            }))
          } finally {
            await browser.close()
          }
          EOF
          node .validation/full-opening-v3.mjs

      - name: Upload opening screenshot
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-full-opening-v3
          path: .validation/chapter1-full-opening-v3.png
          if-no-files-found: error
