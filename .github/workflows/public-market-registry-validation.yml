name: Public market registry validation

on:
  push:
    branches:
      - marketing/public-market-registry-v1
    paths:
      - .github/workflows/public-market-registry-validation.yml

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout registry branch
        uses: actions/checkout@v4
        with:
          ref: marketing/public-market-registry-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact branch scope
        shell: bash
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' .github/workflows/public-market-registry-validation.yml package.json src/marketing/publicMarketRegistry.js src/marketing/publicMarketRegistry.test.js | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          git diff --quiet origin/main...HEAD -- src/App.jsx
          git diff --quiet origin/main...HEAD -- src/lib/marketConfig.js

      - name: Verify fail-closed publication registry
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          const registry = await import('./src/marketing/publicMarketRegistry.js')
          if (registry.getProductionPublicMarketRoutes().length !== 0) {
            throw new Error('A market route became production-routable before release approval.')
          }
          for (const record of registry.PUBLIC_MARKET_REGISTRY) {
            if (record.publicationStatus === registry.PUBLICATION_STATUS.ACTIVE) {
              throw new Error(`Unexpected active market route: ${record.route}`)
            }
          }
          NODE
          ! grep -F "from '../lib/marketConfig" src/marketing/publicMarketRegistry.js
          ! grep -F 'isMarketEnabled' src/marketing/publicMarketRegistry.js

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Remove temporary workflow after successful validation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/public-market-registry-validation.yml
          git commit -m 'Validate fail-closed public market registry'
          git push origin HEAD:marketing/public-market-registry-v1
