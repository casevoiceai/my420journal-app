name: Temporary Phase 1 Router Security Fix

on:
  push:
    branches:
      - feature/phase1-router-security-fix

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify React Router security update'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase1-router-security-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact current dependencies
        run: npm ci
      - name: Upgrade Router to advisory-cleared version
        run: npm install --save-exact react-router-dom@7.18.2
      - name: Run complete test suite
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Verify Router audit is clear
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > router-audit.json || true
          node - <<'NODE'
          const fs = require('fs')
          const audit = JSON.parse(fs.readFileSync('router-audit.json','utf8'))
          const names = Object.keys(audit.vulnerabilities || {})
          const router = names.filter((name) => name === 'react-router' || name === 'react-router-dom')
          console.log('AUDIT_VULNERABILITIES=' + names.join(','))
          if (router.length) {
            console.error('Router vulnerabilities remain: ' + router.join(','))
            process.exit(1)
          }
          console.log('ROUTER_AUDIT=PASS')
          NODE
      - name: Commit verified package update and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git rm .github/workflows/phase1-router-security-fix.yml
          git add package.json package-lock.json
          git commit -m 'Update React Router to security-fixed release'
          git push origin HEAD:feature/phase1-router-security-fix
