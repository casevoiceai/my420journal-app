name: Temporary Weed Goblins Human Playtest 1-3

on:
  push:
    branches:
      - temp/weed-goblins-human-playtest-1-3-20260809

permissions:
  contents: read

jobs:
  deploy-playtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_PROXY_SECRET: ${{ secrets.WEED_GOBLINS_STAGING_PROXY_SECRET }}
      PLAYTEST_URL: https://my420journal-wg-playtest-1-3.casevoice-ai.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/weed-goblins-human-playtest-1-3-20260809
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify exact Chapter 3 feature base and test-only scope
        shell: bash
        run: |
          git fetch origin feature/weed-goblins-session-zero
          test "$(git rev-parse origin/feature/weed-goblins-session-zero)" = "a9021d750698d2b9b211cf3227dca676fe1da11b"
          git diff --check origin/feature/weed-goblins-session-zero
          unexpected=$(git diff --name-only origin/feature/weed-goblins-session-zero | grep -Ev '^(.playtest/|.github/workflows/temp-wg-human-playtest.yml$)' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-playtest changes:"
            echo "$unexpected"
            exit 41
          fi

      - name: Apply Playtest Issue 1 opening candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/games/weed-goblins/weedGoblinsChatControllerChapterOne.js')
          text = path.read_text()
          old = """  const messages = state.narration
            .map((line) => createIncomingChatMessage(line))
            .filter(Boolean)
          """
          new = """  const openingNarration = previousRuns.length === 0
            ? [
                \"Welcome to Weed Goblins. I'm Eliza, your GameMaster. I run the world, the goblins, and everything that happens around you. You decide what your character tries.\",
                \"The road gives out at Windcut Trail, where the Goblin Highlands rise out of the mud and mist. Bent signposts point in three directions at once, bottle-cap charms click in the wind, and fresh little bootprints climb toward the ridgeline.\",
                `A few hours ago, a goblin crew stole ${state.stolenItem} from you and ran north. You followed them this far. Their tracks are fresh, and somewhere above you the King's Stash Hall has just closed its doors.`,
                `Your first job is simple: get into the Highlands, find out who took ${state.stolenItem}, and get it back. What starts as a theft may be carrying a much bigger trail behind it.`,
                \"Here's how we play. I describe what is happening and give you a few blue replies when useful. Those are suggestions, not limits. You can tap one, or type or speak anything else you want your character to try.\",
                \"When an action is risky or uncertain, I'll tell you the difficulty, which stat matters, and the number you need before the Roll D20 button appears. A bad roll changes the situation and creates consequences. It does not erase the story.\",
                \"Before we follow those footprints, I need to know who's walking into this story. We'll settle your name, kind, weapon, approach, pronouns, and look, then the Highlands are yours to deal with.\",
              ]
            : state.narration

          const messages = openingNarration
            .map((line) => createIncomingChatMessage(line))
            .filter(Boolean)
          """
          if old not in text:
              raise SystemExit('opening message block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build Chapters 1-3 playtest candidate
        run: |
          npm ci
          npm run build
          rm -f dist/_redirects

      - name: Set test-host proxy secret
        shell: bash
        run: |
          printf '%s' "$STAGING_PROXY_SECRET" | npx wrangler@latest secret put WEED_GOBLINS_PROXY_SECRET --config .playtest/host/wrangler.jsonc

      - name: Deploy persistent unlisted playtest host
        run: npx wrangler@latest deploy --config .playtest/host/wrangler.jsonc

      - name: Smoke playtest landing game route and staging narration
        shell: bash
        run: |
          landing_status=000
          for i in $(seq 1 25); do
            landing_status=$(curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/playtest.html -w '%{http_code}' "$PLAYTEST_URL/" || true)
            if [ "$landing_status" = 200 ] && grep -q 'Chapter 1' /tmp/playtest.html && grep -q 'Chapter 2' /tmp/playtest.html && grep -q 'Chapter 3' /tmp/playtest.html; then
              break
            fi
            sleep 2
          done
          echo "PLAYTEST_LANDING_STATUS=$landing_status"
          test "$landing_status" = 200
          grep -q 'Chapter 1' /tmp/playtest.html
          grep -q 'Chapter 2' /tmp/playtest.html
          grep -q 'Chapter 3' /tmp/playtest.html

          game_status=$(curl -L -sS --connect-timeout 10 --max-time 30 -H 'Sec-Fetch-Mode: navigate' -o /tmp/game.html -w '%{http_code}' "$PLAYTEST_URL/games/weed-goblins")
          echo "PLAYTEST_GAME_STATUS=$game_status"
          test "$game_status" = 200
          grep -qi '<html' /tmp/game.html

          api_status=$(curl -sS --connect-timeout 10 --max-time 120 -o /tmp/narration.json -w '%{http_code}' -X POST "$PLAYTEST_URL/api/weed-goblins-narration" -H "Origin: $PLAYTEST_URL" -H 'Content-Type: application/json' --data '{"chapterNumber":3,"moment":"scene-intro","outcome":"intro","sceneId":"chapter-3:gray-verge","dangerTier":"bloom","authoritativeText":"The Gray Verge begins where the color stops.","storySoFar":"The grove is turning gray from the roots up while water and sunlight remain.","scenePurpose":"Establish the dying grove and the underground pull.","tensionLevel":"rising","memorySensation":"a low laugh preserved inside amber resin","wound":"None","trouble":0,"manaRemaining":2,"rootcoin":0,"narrationTier":"normal"}')
          echo "PLAYTEST_API_STATUS=$api_status"
          cat /tmp/narration.json
          test "$api_status" = 200

      - name: Browser-check chapter shortcuts and expanded Chapter 1 opening
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          mkdir -p .validation
          cat > .validation/playtest-shortcuts.mjs <<'EOF'
          import { chromium } from 'playwright'
          const base = process.env.PLAYTEST_URL
          const check = (condition, message) => { if (!condition) throw new Error(message) }
          const browser = await chromium.launch({ headless: true })
          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
            await page.goto(base + '/', { waitUntil: 'networkidle' })
            check(await page.getByRole('button', { name: /Chapter 1/ }).isVisible(), 'Chapter 1 button missing')
            check(await page.getByRole('button', { name: /Chapter 2/ }).isVisible(), 'Chapter 2 button missing')
            check(await page.getByRole('button', { name: /Chapter 3/ }).isVisible(), 'Chapter 3 button missing')

            await page.getByRole('button', { name: /Chapter 3/ }).click()
            await page.waitForURL('**/games/weed-goblins')
            await page.getByText(/Living Root Map has a destination now/i).waitFor({ timeout: 15000 })
            const stored = await page.evaluate(() => {
              const userId = localStorage.getItem('my420journal_local_v1:active_user')
              const raw = localStorage.getItem('my420journal_local_v1:weed_goblins_runs:' + userId)
              return { userId, runs: raw ? JSON.parse(raw) : [] }
            })
            check(stored.userId === 'weed-goblins-playtest-user', `wrong playtest user: ${stored.userId}`)
            check(stored.runs.length === 10, `Chapter 3 shortcut expected 10 fixture runs, got ${stored.runs.length}`)
            check(stored.runs.filter((run) => run.adventureId === 'goblin-highlands-session-1').length === 5, 'Chapter 1 fixture count wrong')
            check(stored.runs.filter((run) => run.adventureId === 'hollow-market-session-1').length === 5, 'Chapter 2 fixture count wrong')

            await page.goto(base + '/', { waitUntil: 'networkidle' })
            await page.getByRole('button', { name: /Chapter 1/ }).click()
            await page.waitForURL('**/games/weed-goblins')
            await page.getByText(/Welcome to Weed Goblins\. I'm Eliza, your GameMaster/i).waitFor({ timeout: 15000 })
            await page.getByText(/goblin crew stole .* from you and ran north/i).waitFor()
            await page.getByText(/suggestions, not limits/i).waitFor()
            await page.getByText(/difficulty, which stat matters, and the number you need/i).waitFor()
            await page.getByText(/Before we follow those footprints/i).waitFor()
            const openingBody = await page.locator('body').innerText()
            check(openingBody.includes('Windcut Trail'), 'opening is missing setting narration')
            check(openingBody.includes("King's Stash Hall"), 'opening is missing story objective trail')
            check(openingBody.includes('type or speak anything else'), 'opening is missing free-action explanation')
            check(openingBody.includes('Roll D20'), 'opening is missing D20 explanation')
            check(openingBody.includes('Continue'), 'character setup Continue control missing after opening')
            const chapterOneStored = await page.evaluate(() => {
              const userId = localStorage.getItem('my420journal_local_v1:active_user')
              const raw = localStorage.getItem('my420journal_local_v1:weed_goblins_runs:' + userId)
              return raw ? JSON.parse(raw).length : 0
            })
            check(chapterOneStored === 0, `Chapter 1 shortcut expected 0 fixture runs, got ${chapterOneStored}`)
            await page.screenshot({ path: '.validation/chapter1-opening.png', fullPage: false })
            console.log('CHAPTER_1_OPENING_TEXT_START')
            console.log(openingBody)
            console.log('CHAPTER_1_OPENING_TEXT_END')
            console.log('PLAYTEST_SHORTCUTS_AND_OPENING_PASS')
          } finally {
            await browser.close()
          }
          EOF
          node .validation/playtest-shortcuts.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-opening-playtest
          path: .validation/chapter1-opening.png
          if-no-files-found: ignore
