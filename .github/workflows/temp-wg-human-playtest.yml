name: Temporary Weed Goblins Human Playtest 1-3

on:
  push:
    branches:
      - temp/weed-goblins-human-playtest-1-3-20260809

permissions:
  contents: read

jobs:
  deploy-playtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_PROXY_SECRET: ${{ secrets.WEED_GOBLINS_STAGING_PROXY_SECRET }}
      PLAYTEST_URL: https://my420journal-wg-playtest-1-3.casevoice-ai.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/weed-goblins-human-playtest-1-3-20260809
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify exact Chapter 3 feature base and test-only scope
        shell: bash
        run: |
          git fetch origin feature/weed-goblins-session-zero
          test "$(git rev-parse origin/feature/weed-goblins-session-zero)" = "a9021d750698d2b9b211cf3227dca676fe1da11b"
          git diff --check origin/feature/weed-goblins-session-zero
          unexpected=$(git diff --name-only origin/feature/weed-goblins-session-zero | grep -Ev '^(.playtest/|.github/workflows/temp-wg-human-playtest.yml$)' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-playtest changes:"
            echo "$unexpected"
            exit 41
          fi

      - name: Apply Playtest Issue 1 opening candidate pass 2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/games/weed-goblins/weedGoblinsChatControllerChapterOne.js')
          text = path.read_text()
          pattern = re.compile(
              r"  const messages = state\.narration\s*\n\s*\.map\(\(line\) => createIncomingChatMessage\(line\)\)\s*\n\s*\.filter\(Boolean\)"
          )
          replacement = """  const openingNarration = previousRuns.length === 0
            ? [
                \"All right. Mud up to your ankle, cold wind coming down off the ridge, and the last fencepost before the Goblin Highlands has a sign nailed to it: NO GOBLINS BEYOND THIS POINT. Somebody has crossed out NO.\",
                `Three hours ago, a goblin crew ran off with ${state.stolenItem}. You followed their tracks north until the road stopped pretending to be a road.`,
                `Ahead, the Highlands climb into fog and crooked pines. Somewhere up there is the King's Stash Hall. Somewhere inside it is your stuff. That's the job: get in, find out who took ${state.stolenItem}, and get it back.`,
                \"I'm Eliza. I run the world, the goblins, the weather, the bad ideas, and whatever notices you in the dark. You tell me what your character does. I tell you what the world does back.\",
                \"I'll throw a few obvious moves your way when it helps, but they're never the walls of the game. Tap one, type something else, or say it out loud. If you want to bluff a goblin, climb something stupid, bribe a suspicious shrub, or try something I never suggested, go for it.\",
                \"If what you're trying could go badly, I'll stop before it happens and tell you what matters and what number you need. Then you roll the D20 and we live with it. Bad rolls make trouble. They don't erase the story.\",
                `Now. Before I send some anonymous lunatic into the Goblin Highlands after ${state.stolenItem}, I need to know who I'm dealing with. Let's start with your name.`,
              ]
            : state.narration

          const messages = openingNarration
            .map((line) => createIncomingChatMessage(line))
            .filter(Boolean)"""
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'opening message block replacement count was {count}')
          path.write_text(updated)
          print('PLAYTEST_OPENING_PASS2_PATCH_APPLIED')
          PY

      - name: Build Chapters 1-3 playtest candidate
        run: |
          npm ci
          npm run build
          rm -f dist/_redirects

      - name: Set test-host proxy secret
        shell: bash
        run: |
          printf '%s' "$STAGING_PROXY_SECRET" | npx wrangler@latest secret put WEED_GOBLINS_PROXY_SECRET --config .playtest/host/wrangler.jsonc

      - name: Deploy persistent unlisted playtest host
        run: npx wrangler@latest deploy --config .playtest/host/wrangler.jsonc

      - name: Smoke playtest landing game route and staging narration
        shell: bash
        run: |
          landing_status=000
          for i in $(seq 1 25); do
            landing_status=$(curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/playtest.html -w '%{http_code}' "$PLAYTEST_URL/" || true)
            if [ "$landing_status" = 200 ] && grep -q 'Chapter 1' /tmp/playtest.html && grep -q 'Chapter 2' /tmp/playtest.html && grep -q 'Chapter 3' /tmp/playtest.html; then
              break
            fi
            sleep 2
          done
          echo "PLAYTEST_LANDING_STATUS=$landing_status"
          test "$landing_status" = 200
          grep -q 'Chapter 1' /tmp/playtest.html
          grep -q 'Chapter 2' /tmp/playtest.html
          grep -q 'Chapter 3' /tmp/playtest.html

          game_status=$(curl -L -sS --connect-timeout 10 --max-time 30 -H 'Sec-Fetch-Mode: navigate' -o /tmp/game.html -w '%{http_code}' "$PLAYTEST_URL/games/weed-goblins")
          echo "PLAYTEST_GAME_STATUS=$game_status"
          test "$game_status" = 200
          grep -qi '<html' /tmp/game.html

          api_status=$(curl -sS --connect-timeout 10 --max-time 120 -o /tmp/narration.json -w '%{http_code}' -X POST "$PLAYTEST_URL/api/weed-goblins-narration" -H "Origin: $PLAYTEST_URL" -H 'Content-Type: application/json' --data '{"chapterNumber":3,"moment":"scene-intro","outcome":"intro","sceneId":"chapter-3:gray-verge","dangerTier":"bloom","authoritativeText":"The Gray Verge begins where the color stops.","storySoFar":"The grove is turning gray from the roots up while water and sunlight remain.","scenePurpose":"Establish the dying grove and the underground pull.","tensionLevel":"rising","memorySensation":"a low laugh preserved inside amber resin","wound":"None","trouble":0,"manaRemaining":2,"rootcoin":0,"narrationTier":"normal"}')
          echo "PLAYTEST_API_STATUS=$api_status"
          cat /tmp/narration.json
          test "$api_status" = 200

      - name: Browser-check chapter shortcuts and GM-style Chapter 1 opening
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          mkdir -p .validation
          cat > .validation/playtest-shortcuts.mjs <<'EOF'
          import { chromium } from 'playwright'
          const base = process.env.PLAYTEST_URL
          const check = (condition, message) => { if (!condition) throw new Error(message) }
          const browser = await chromium.launch({ headless: true })
          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
            await page.goto(base + '/', { waitUntil: 'networkidle' })
            check(await page.getByRole('button', { name: /Chapter 1/ }).isVisible(), 'Chapter 1 button missing')
            check(await page.getByRole('button', { name: /Chapter 2/ }).isVisible(), 'Chapter 2 button missing')
            check(await page.getByRole('button', { name: /Chapter 3/ }).isVisible(), 'Chapter 3 button missing')

            await page.getByRole('button', { name: /Chapter 1/ }).click()
            await page.waitForURL('**/games/weed-goblins')
            await page.getByText(/Mud up to your ankle/i).waitFor({ timeout: 15000 })
            await page.getByText(/goblin crew ran off with/i).waitFor()
            await page.getByText(/I run the world, the goblins, the weather, the bad ideas/i).waitFor()
            await page.getByText(/bribe a suspicious shrub/i).waitFor()
            await page.getByText(/Then you roll the D20 and we live with it/i).waitFor()
            await page.getByText(/anonymous lunatic/i).waitFor()
            const openingBody = await page.locator('body').innerText()
            check(openingBody.includes('NO GOBLINS BEYOND THIS POINT'), 'opening is missing the first scene image')
            check(openingBody.includes("King's Stash Hall"), 'opening is missing the objective')
            check(openingBody.includes('type something else, or say it out loud'), 'opening is missing free-action explanation')
            check(openingBody.includes('Bad rolls make trouble'), 'opening is missing failure-forward explanation')
            check(openingBody.includes('Continue'), 'character setup Continue control missing after opening')
            await page.screenshot({ path: '.validation/chapter1-opening-pass2.png', fullPage: false })
            console.log('CHAPTER_1_OPENING_PASS2_TEXT_START')
            console.log(openingBody)
            console.log('CHAPTER_1_OPENING_PASS2_TEXT_END')
            console.log('PLAYTEST_OPENING_PASS2_OK')
          } finally {
            await browser.close()
          }
          EOF
          node .validation/playtest-shortcuts.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-opening-playtest-pass2
          path: .validation/chapter1-opening-pass2.png
          if-no-files-found: ignore
