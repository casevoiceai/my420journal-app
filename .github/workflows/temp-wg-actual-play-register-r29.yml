name: Weed Goblins Actual Play Register R29

on:
  push:
    branches:
      - temp/weed-goblins-actual-play-register-20260810
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weed-goblins-actual-play-r29
  cancel-in-progress: true

jobs:
  verify-deploy-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_PROXY_SECRET: ${{ secrets.WEED_GOBLINS_STAGING_PROXY_SECRET }}
      PLAYTEST_URL: https://my420journal-wg-playtest-1-3.casevoice-ai.workers.dev/games/weed-goblins
      EXPECTED_REVISION: actual-play-register-r29

    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/weed-goblins-actual-play-register-20260810
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify protected feature branch and private base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/weed-goblins-session-zero temp/weed-goblins-check-type-audit-20260809
          test "$(git rev-parse origin/feature/weed-goblins-session-zero)" = "a9021d750698d2b9b211cf3227dca676fe1da11b"
          test "$(git rev-parse origin/feature/weed-goblins-session-zero:src/features/games/weed-goblins/weedGoblinsEngine.js)" = "02b3bdc10a32687fed81e230525b418567645b6a"
          test "$(git rev-parse origin/temp/weed-goblins-check-type-audit-20260809)" = "a55728486eb2bc19191b9ad2c9618c19918d74f9"

      - name: Rebuild current private playtest stack
        shell: bash
        run: |
          set -euo pipefail
          python .playtest/apply_human_gm_prose_v3.py
          python .playtest/apply_approved_kings_stash_opening.py
          git fetch origin temp/weed-goblins-narration-voice-audit-20260809
          test "$(git rev-parse origin/temp/weed-goblins-narration-voice-audit-20260809)" = "c7f67befc2cf5175787d615ada1e3a1017294f48"
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/legacyChapterOne.js > server/weed-goblins-narration-worker/legacyChapterOne.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:src/features/games/weed-goblins/weedGoblinsNarrationValidation.js > src/features/games/weed-goblins/weedGoblinsNarrationValidation.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/voice-audit.test.js > server/weed-goblins-narration-worker/voice-audit.test.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/index.test.js > server/weed-goblins-narration-worker/index.test.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/story-beats.test.js > server/weed-goblins-narration-worker/story-beats.test.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:src/features/games/weed-goblins/weedGoblinsAiComplication.test.js > src/features/games/weed-goblins/weedGoblinsAiComplication.test.js
          python .playtest/apply_research_rules.py
          python .playtest/apply_behavior_architecture.py
          python .playtest/apply_behavior_architecture_compat.py
          python .playtest/apply_post_rattlebridge_gameplay_fixes.py
          python .playtest/apply_choice_restore_hardening.py
          python .playtest/apply_restart_busy_hardening.py
          python .playtest/apply_restore_die_fix.py
          python .playtest/apply_check_type_audit_v2.py
          python .playtest/apply_eliza_intro_restore_migration.py
          python .playtest/apply_actual_play_register.py
          git diff --check

      - name: Verify actual-play contract and static sequence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict'
          import {
            SESSION_ZERO_WELCOME,
            createWeedGoblinsRun,
            advanceWeedGoblinsRun,
            advanceWeedGoblinsSessionText,
          } from './src/features/games/weed-goblins/weedGoblinsEngine.js'
          import { WEED_GOBLINS_SYSTEM_PROMPT } from './server/weed-goblins-narration-worker/legacyChapterOne.js'
          import { CHAPTER_TWO_SYSTEM_PROMPT } from './server/weed-goblins-narration-worker/chapterTwo.js'
          import { CHAPTER_THREE_SYSTEM_PROMPT } from './server/weed-goblins-narration-worker/chapterThree.js'

          for (const prompt of [WEED_GOBLINS_SYSTEM_PROMPT, CHAPTER_TWO_SYSTEM_PROMPT, CHAPTER_THREE_SYSTEM_PROMPT]) {
            assert.match(prompt, /ACTUAL PLAY CORE VOICE/)
            assert.match(prompt, /Never introduce yourself, name yourself, explain your role/)
            assert.match(prompt, /loose, quick, present-tense, and conversational/)
            assert.match(prompt, /Cut atmospheric density hard/)
            assert.doesNotMatch(prompt, /patient, lush, curious/)
          }
          assert.equal(SESSION_ZERO_WELCOME.length, 5)
          assert.equal(SESSION_ZERO_WELCOME.some((line) => /I'm Eliza|running the game|how the game works/i.test(line)), false)
          assert.match(SESSION_ZERO_WELCOME[0], /chasing five goblins uphill/)
          assert.match(SESSION_ZERO_WELCOME[4], /what's your character's name/)

          let state = createWeedGoblinsRun({ seed: 'actual-play-static-check' })
          state = advanceWeedGoblinsRun(state, 'session:continue')
          state = advanceWeedGoblinsSessionText(state, 'Fenna')
          state = advanceWeedGoblinsRun(state, 'session:race:human')
          state = advanceWeedGoblinsRun(state, 'session:weapon:sword')
          state = advanceWeedGoblinsRun(state, 'background:tracker')
          state = advanceWeedGoblinsRun(state, 'session:pronoun:they')
          state = advanceWeedGoblinsRun(state, 'session:look:tall-weathered')
          const tail = state.narration.slice(-2).join(' ')
          assert.match(tail, /Calling it a bridge is generous/)
          assert.match(tail, /just book it/)
          assert.doesNotMatch(tail, /I'm Eliza|running the game/i)
          console.log('ACTUAL_PLAY_STATIC_CONTRACT=PASS')
          EOF

      - name: Install, targeted tests, and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test \
            server/weed-goblins-narration-worker/index.test.js \
            server/weed-goblins-narration-worker/story-beats.test.js \
            src/features/games/weed-goblins/weedGoblinsAiComplication.test.js \
            src/features/games/weed-goblins/weedGoblinsCheckTypeAudit.test.js \
            src/features/games/weed-goblins/weedGoblinsPersistenceDieRestore.test.js \
            src/features/games/weed-goblins/weedGoblinsPostRattlebridge.test.js
          python - <<'PY'
          from pathlib import Path
          path = Path('public/_headers')
          text = path.read_text()
          import re
          text, count = re.subn(r'X-WG-Playtest-Revision: [^\n]+', 'X-WG-Playtest-Revision: actual-play-register-r29', text, count=1)
          if count != 1:
              raise SystemExit('playtest revision header missing')
          path.write_text(text)
          PY
          npm run build
          rm -f dist/_redirects

      - name: Deploy narration Worker to staging only
        working-directory: server/weed-goblins-narration-worker
        run: npx wrangler@latest deploy --env staging

      - name: Set private host secret
        shell: bash
        run: printf '%s' "$STAGING_PROXY_SECRET" | npx wrangler@latest secret put WEED_GOBLINS_PROXY_SECRET --config .playtest/host/wrangler.jsonc

      - name: Deploy private playtest host only
        run: npx wrangler@latest deploy --config .playtest/host/wrangler.jsonc

      - name: Wait for exact live revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            headers="$(curl -sS -D - -o /tmp/wg-r29.html "$PLAYTEST_URL" || true)"
            normalized="$(printf '%s' "$headers" | tr '[:upper:]' '[:lower:]' | tr -d '\r')"
            if printf '%s' "$normalized" | grep -Fq "x-wg-playtest-revision: $EXPECTED_REVISION"; then
              printf '%s\n' "$normalized" | grep -F "cache-control: no-store"
              echo "LIVE_ROUTE_REVISION=$EXPECTED_REVISION"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify fresh, restored, and Rattlebridge live behavior
        shell: bash
        run: |
          cat > wg-r29-live.mjs <<'EOF'
          import { chromium } from 'playwright'

          const url = process.env.PLAYTEST_URL
          const check = (condition, message) => { if (!condition) throw new Error(message) }
          const newOpeningOne = "Okay, so you've been chasing five goblins uphill for about an hour. They stole your Brass-Latched Research Case, they are not especially good at escaping with it, and the trail is honestly doing most of the work for you."
          const newOpeningLast = "Before you catch up with them, what's your character's name, and are they human, dwarf, elf, or gnome?"
          const oldOpeningOne = "By the time the road finally gives up, you've been climbing for a little over an hour. What remains of it dissolves beneath your boots into black mud and flattened grass, while a cold wind comes wandering down from the high country looking for every gap in your clothes. It finds them. The air smells of wet pine and distant woodsmoke, with something greener underneath, sharp and earthy. Above you, the Goblin Highlands appear and disappear through the moving cloud, one shoulder of black rock giving way to a roofline on the ridge before the mist takes it again."
          const oldSelfIntro = "I'm Eliza. I'll be running everything from here, the goblins, the weather, whoever's dumb enough to get in your way. Tell me what you're trying to do and I'll tell you what happens."
          const bridgeOne = "A little farther up, the trail runs straight into Rattlebridge. Calling it a bridge is generous. It's some planks, two ropes, and an absolutely unreasonable number of bottle caps tied along the rails as an alarm system. Somebody kept having ideas."
          const bridgeTwo = "There's movement on the far side, tucked behind one of the posts. They haven't seen you yet. You can sneak across, just book it before the bottle caps start screaming, or try something else."

          const browser = await chromium.launch({ headless: true })
          try {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } })
            await context.addInitScript(() => localStorage.clear())
            const page = await context.newPage()
            let narration200 = 0
            page.on('response', (response) => {
              if (response.url().includes('/api/weed-goblins-narration') && response.status() === 200) narration200 += 1
            })

            await page.goto(url, { waitUntil: 'networkidle' })
            await page.getByText(newOpeningOne, { exact: true }).waitFor({ timeout: 30000 })
            await page.getByText(newOpeningLast, { exact: true }).waitFor({ timeout: 30000 })
            let body = await page.locator('body').innerText()
            check(!body.includes(oldOpeningOne), 'old literary opening survived fresh load')
            check(!body.includes(oldSelfIntro), 'old Eliza self introduction survived fresh load')
            console.log('FRESH_ACTUAL_PLAY_OPENING=PASS')

            const seeded = await page.evaluate(({ newOpeningOne, oldOpeningOne }) => {
              const keys = Array.from({ length: localStorage.length }, (_, index) => localStorage.key(index)).filter(Boolean)
              let changed = 0
              for (const key of keys) {
                if (!key.includes('weed_goblins_active_run')) continue
                const value = localStorage.getItem(key)
                if (!value || !value.includes(newOpeningOne)) continue
                localStorage.setItem(key, value.split(newOpeningOne).join(oldOpeningOne))
                changed += 1
              }
              return changed
            }, { newOpeningOne, oldOpeningOne })
            check(seeded > 0, 'could not seed old saved opening')
            await page.reload({ waitUntil: 'networkidle' })
            await page.getByText(newOpeningOne, { exact: true }).waitFor({ timeout: 30000 })
            body = await page.locator('body').innerText()
            check(!body.includes(oldOpeningOne), 'old saved opening survived restore migration')
            console.log('RESTORED_ACTUAL_PLAY_OPENING=PASS')

            await page.getByRole('button', { name: 'Continue' }).click()
            const composer = page.locator('.weed-goblins-game__composer input')
            await composer.waitFor()
            await composer.fill('Fenna')
            await page.locator('.weed-goblins-game__send-button').click()
            await page.getByRole('button', { name: 'Human' }).click()
            await page.getByRole('button', { name: 'Sword' }).click()
            await page.getByRole('button', { name: 'Highland Tracker' }).click()
            await page.getByRole('button', { name: 'They' }).click()
            await page.locator('.weed-goblins-game__quick-reply').first().click()

            await page.getByText(bridgeOne, { exact: true }).waitFor({ timeout: 30000 })
            await page.getByText(bridgeTwo, { exact: true }).waitFor({ timeout: 30000 })
            body = await page.locator('body').innerText()
            check(!body.includes('The goblin tracks carry on through Windcut Trail until the ground drops toward Rattlebridge'), 'old Rattlebridge prose survived')
            console.log('RATTLEBRIDGE_ACTUAL_PLAY_STATIC=PASS')

            await page.getByRole('button', { name: /Quiet Crossing/ }).click()
            await page.getByText(/Defense check, DC 12;/i).waitFor({ timeout: 30000 })
            await page.getByRole('button', { name: /ROLL D20/i }).click()
            await page.getByRole('button', { name: /Outlast / }).waitFor({ timeout: 30000 })
            check(narration200 > 0, 'Rattlebridge did not receive a successful live narration response')

            const incoming = await page.locator('.weed-goblins-game__message-row.is-incoming').allTextContents()
            const joined = incoming.join(' ')
            check(!/I'm Eliza|my name is Eliza|I'll be running the game/i.test(joined), 'self introduction appeared in live narration')
            check(!joined.includes(oldSelfIntro), 'old self-introduction appeared after live narration')
            const dimensions = await page.evaluate(() => ({ width: document.documentElement.clientWidth, scroll: document.documentElement.scrollWidth }))
            check(dimensions.width === dimensions.scroll, `horizontal overflow ${dimensions.width}/${dimensions.scroll}`)
            console.log('RATTLEBRIDGE_LIVE_NARRATION_RESPONSE=PASS')
            console.log(`MOBILE_WIDTH=${dimensions.width}/${dimensions.scroll}`)
            console.log(`LIVE_URL=${page.url()}`)
            console.log('ACTUAL_PLAY_REGISTER_R29_LIVE=PASS')
          } finally {
            await browser.close()
          }
          EOF
          node wg-r29-live.mjs
