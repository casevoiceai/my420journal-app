name: Temporary Phase 1 Router Live Smoke

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: write
  checks: read

jobs:
  smoke:
    if: github.event.head_commit.message == 'Run Router security live smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_BASE: https://feature-phase1-log-talk-play.my420journal-app.pages.dev
      BRANCH_NAME: feature/phase1-log-talk-play-integration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase1-log-talk-play-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Rotate to masked CI-only tester code
        shell: bash
        run: |
          set -euo pipefail
          original_hash=$(python - <<'PY'
          from pathlib import Path
          import re
          text=Path('server/phase1-preview-access.js').read_text()
          m=re.search(r"PHASE1_PREVIEW_ACCESS_CODE_SHA256 = '([0-9a-f]{64})'", text)
          if not m: raise SystemExit('Preview hash missing')
          print(m.group(1))
          PY
          )
          echo "ORIGINAL_HASH=$original_hash" >> "$GITHUB_ENV"
          raw=$(openssl rand -hex 18 | tr '[:lower:]' '[:upper:]')
          code="ROUTER-${raw:0:6}-${raw:6:6}-${raw:12:6}-${raw:18:6}-${raw:24:6}-${raw:30:6}"
          echo "::add-mask::$code"
          temp_hash=$(printf '%s' "$code" | sha256sum | awk '{print $1}')
          echo "TEMP_TEST_CODE=$code" >> "$GITHUB_ENV"
          python - "$temp_hash" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('server/phase1-preview-access.js')
          text=p.read_text()
          text,count=re.subn(r"(PHASE1_PREVIEW_ACCESS_CODE_SHA256 = ')[0-9a-f]{64}(')", rf"\g<1>{sys.argv[1]}\g<2>", text, count=1)
          if count != 1: raise SystemExit('Expected one preview hash')
          p.write_text(text)
          PY
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add server/phase1-preview-access.js
          git commit -m 'Temporary Router smoke hash'
          git push origin "HEAD:$BRANCH_NAME"
          echo "TEST_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Wait for exact Cloudflare test deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            json=$(curl -sS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TEST_COMMIT/check-runs?per_page=100")
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success")' >/dev/null; then exit 0; fi
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion!="success")' >/dev/null; then exit 1; fi
            sleep 3
          done
          exit 1
      - name: Run live Router smoke
        shell: bash
        run: |
          mkdir -p router-smoke
          cat > router-smoke-run.mjs <<'NODE'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          const base=process.env.PREVIEW_BASE
          const code=process.env.TEMP_TEST_CODE
          const results=[]
          const record=(test,status,detail='')=>{results.push({test,status,detail});console.log(`[${status}] ${test}${detail?` -- ${detail}`:''}`)}
          const browser=await chromium.launch({headless:true})
          const context=await browser.newContext({viewport:{width:1280,height:900}})
          const page=await context.newPage()
          const pageErrors=[]
          page.on('pageerror',e=>pageErrors.push({url:page.url(),message:e.message}))
          try {
            const blocked=await page.goto(base,{waitUntil:'networkidle',timeout:60000})
            record('private gate rejects unauthenticated',blocked?.status()===401?'PASS':'BLOCKER',`status=${blocked?.status()}`)
            await page.getByLabel('Access code').fill(code)
            await page.getByRole('button',{name:'Continue'}).click()
            await page.waitForURL(`${base}/`,{timeout:15000})
            record('masked access opens Router app','PASS')

            await page.goto(`${base}/about`,{waitUntil:'networkidle'})
            record('BrowserRouter public route renders',(await page.locator('body').innerText()).length>100?'PASS':'BLOCKER',page.url())

            await page.goto(`${base}/signup?m420test=1`,{waitUntil:'networkidle'})
            await page.getByRole('button',{name:'Create your account'}).click()
            await page.waitForURL(/\/onboarding/,{timeout:15000})
            await page.getByRole('button',{name:'Meet them'}).click()
            await page.getByRole('button',{name:/Sunny Day/}).first().click()
            await page.getByRole('button',{name:'Choose Sunny as my guide'}).click()
            await page.waitForURL(/step=location/,{timeout:10000})
            await page.getByRole('button',{name:'Skip for now'}).click()
            await page.waitForURL(/\/pin-setup/,{timeout:10000})
            await page.getByRole('button',{name:'Skip for now'}).click()
            await page.waitForURL(/\/home/,{timeout:10000})
            record('Router onboarding and navigate flow works','PASS',page.url())

            for (const path of ['/journal','/guide','/settings','/games/weed-goblins']) {
              await page.goto(base+path,{waitUntil:'networkidle',timeout:30000})
              const text=(await page.locator('body').innerText()).trim()
              record(`route ${path} renders`,text.length>40?'PASS':'BLOCKER',page.url())
            }
            for (const [path,title] of [['/games/who-took-my-lighter','Who Took My Lighter?'],['/games/the-new-place','The New Place']]) {
              await page.goto(base+path,{waitUntil:'networkidle',timeout:30000})
              const text=await page.locator('body').innerText()
              record(`direct experience ${path} renders`,text.includes(title)?'PASS':'BLOCKER',page.url())
            }
            await page.goto(base+'/this-route-does-not-exist',{waitUntil:'networkidle'})
            record('wildcard redirects to marketing home',new URL(page.url()).pathname==='/'?'PASS':'BLOCKER',page.url())
            await page.screenshot({path:'router-smoke/final.png',fullPage:true})
          } catch(error) {
            record('live Router smoke','HARNESS-OR-PRODUCT-FAIL',error.message)
            await page.screenshot({path:'router-smoke/failure.png',fullPage:true}).catch(()=>{})
          }
          const report={results,pageErrors,finishedAt:new Date().toISOString()}
          fs.writeFileSync('router-smoke/report.json',JSON.stringify(report,null,2))
          console.log('ROUTER_SMOKE_REPORT='+JSON.stringify(report))
          if (results.some(r=>r.status!=='PASS') || pageErrors.length) process.exitCode=1
          await browser.close()
          NODE
          node ./router-smoke-run.mjs
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-router-live-smoke
          path: router-smoke/
          retention-days: 7
      - name: Restore founder access and remove workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"
          test -n "${ORIGINAL_HASH:-}"
          python - "$ORIGINAL_HASH" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('server/phase1-preview-access.js')
          text=p.read_text()
          text,count=re.subn(r"(PHASE1_PREVIEW_ACCESS_CODE_SHA256 = ')[0-9a-f]{64}(')", rf"\g<1>{sys.argv[1]}\g<2>", text, count=1)
          if count != 1: raise SystemExit('Expected one preview hash')
          p.write_text(text)
          PY
          git rm -f .github/workflows/phase1-router-live-smoke.yml
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add server/phase1-preview-access.js
          git commit -m 'Restore founder access after Router smoke'
          git push origin "HEAD:$BRANCH_NAME"
          echo "RESTORE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify restored preview deployment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${RESTORE_COMMIT:-}"
          for attempt in $(seq 1 100); do
            json=$(curl -sS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$RESTORE_COMMIT/check-runs?per_page=100")
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success")' >/dev/null; then exit 0; fi
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion!="success")' >/dev/null; then exit 1; fi
            sleep 3
          done
          exit 1
