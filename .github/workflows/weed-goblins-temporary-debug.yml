name: Temporary Weed Goblins Verify

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: read

jobs:
  current-weed-goblins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Run current runtime regression
        run: node --test src/features/games/weed-goblins/weedGoblinsCurrentRuntime.test.js
      - name: Run Chapter 2 integration
        run: node --test src/features/games/weed-goblins/weedGoblinsChapterTwoIntegration.test.js
      - name: Run Chapter 2 persistence
        run: node --test src/features/games/weed-goblins/weedGoblinsChapterTwoPersistence.test.js
