name: Temporary Phase 1 Candidate Gate

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: read

jobs:
  candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Run candidate current Phase 1 test gate
        run: >-
          node --test
          src/features/games/weed-goblins/weedGoblinsAiComplication.test.js
          src/features/games/weed-goblins/weedGoblinsChapterOneStatic.test.js
          src/features/games/weed-goblins/weedGoblinsChapterThreeRuntime.test.js
          src/features/games/weed-goblins/weedGoblinsChapterTwo.test.js
          src/features/games/weed-goblins/weedGoblinsChapterTwoHelp.test.js
          src/features/games/weed-goblins/weedGoblinsChapterTwoIntegration.test.js
          src/features/games/weed-goblins/weedGoblinsChapterTwoNarration.test.js
          src/features/games/weed-goblins/weedGoblinsChapterTwoPersistence.test.js
          src/features/games/weed-goblins/weedGoblinsChapterTwoRuntime.test.js
          src/features/games/weed-goblins/weedGoblinsCurrentRuntime.test.js
          src/features/games/weed-goblins/weedGoblinsDiscoverables.test.js
          src/features/games/weed-goblins/weedGoblinsFreeTextInterpreter.test.js
          src/features/games/weed-goblins/weedGoblinsFreeTextNarration.test.js
          src/features/games/weed-goblins/weedGoblinsHelp.test.js
          src/features/games/weed-goblins/weedGoblinsHiddenMenuVoice.test.js
          src/features/games/weed-goblins/weedGoblinsNarrationStoryBeats.test.js
          src/features/games/weed-goblins/weedGoblinsPagesFunction.test.js
          src/features/games/weed-goblins/weedGoblinsProgression.test.js
          src/features/games/who-took-my-lighter/whoTookMyLighterEngine.test.js
          src/features/games/who-took-my-lighter/whoTookMyLighterLocalDataAdapter.test.js
          src/features/games/who-took-my-lighter/whoTookMyLighterGuide.test.js
          src/features/games/the-new-place/theNewPlaceEngine.test.js
          src/features/games/the-new-place/theNewPlaceLocalDataAdapter.test.js
          src/features/games/the-new-place/theNewPlaceGuide.test.js
          src/lib/sharedAggregateProxy.test.js
          server/weed-goblins-narration-worker/index.test.js
          server/weed-goblins-narration-worker/story-beats.test.js
          server/shared-aggregate-worker/index.test.js
      - name: Build production bundle
        run: npm run build
