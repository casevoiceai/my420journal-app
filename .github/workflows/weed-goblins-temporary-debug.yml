name: Temporary Weed Goblins Debug

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Run full tests with complete failure summary
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          python - <<'PY'
          from pathlib import Path
          lines = Path('test-output.log').read_text(errors='replace').splitlines()
          failures = [line for line in lines if line.startswith('not ok')]
          totals = [line for line in lines if line.startswith('# tests ') or line.startswith('# pass ') or line.startswith('# fail ')]
          summary = '\n'.join(['ALL FAILURES:', *failures, '', 'TAP TOTALS:', *totals])
          summary = summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error::{summary}')
          PY
          exit "$status"
