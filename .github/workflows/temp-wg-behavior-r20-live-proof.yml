name: Eliza Behavior R20 Exact Live Proof

on:
  push:
    branches:
      - temp/weed-goblins-human-playtest-1-3-20260809
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weed-goblins-behavior-r20-live-proof
  cancel-in-progress: true

jobs:
  exact-live-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYTEST_URL: https://my420journal-wg-playtest-1-3.casevoice-ai.workers.dev/games/weed-goblins
      EXPECTED_REVISION: behavior-architecture-r20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/weed-goblins-human-playtest-1-3-20260809

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for same-SHA R20 deployment workflow
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/330757908/runs?head_sha=$GITHUB_SHA&event=push&per_page=5" --jq '.workflow_runs[0] | [.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"
            if [[ "$state" == $'completed\t'* ]]; then
              echo "R20 same-SHA workflow finished: $state"
              break
            fi
            echo "Waiting for R20 same-SHA deploy, attempt $attempt: ${state:-not-visible-yet}"
            sleep 3
          done
          headers="$(curl -sS -D - -o /tmp/wg-r20-proof.html "$PLAYTEST_URL")"
          normalized="$(printf '%s' "$headers" | tr '[:upper:]' '[:lower:]' | tr -d '\r')"
          printf '%s\n' "$normalized" | grep -F "x-wg-playtest-revision: $EXPECTED_REVISION"
          printf '%s\n' "$normalized" | grep -F "cache-control: no-store"

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run complete exact-URL browser proof
        shell: bash
        run: |
          mkdir -p .validation
          cat > .validation/wg-r20-live-proof.mjs <<'EOF'
          import { chromium } from 'playwright'

          const url = process.env.PLAYTEST_URL
          const expectedRevision = process.env.EXPECTED_REVISION
          const check = (condition, message) => { if (!condition) throw new Error(message) }
          const browser = await chromium.launch({ headless: true })
          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
            const narrationStatuses = []
            page.on('response', (response) => {
              if (response.url().includes('/api/weed-goblins-narration')) narrationStatuses.push(response.status())
            })

            const response = await page.goto(url, { waitUntil: 'networkidle' })
            check(response, 'No document response')
            check(response.url() === url, `Wrong final URL: ${response.url()}`)
            check(response.headers()['x-wg-playtest-revision'] === expectedRevision, `Wrong revision: ${response.headers()['x-wg-playtest-revision'] || 'missing'}`)
            check((response.headers()['cache-control'] || '').includes('no-store'), 'Game route is cacheable')
            await page.getByText(/By the time the road finally gives up/i).waitFor({ timeout: 15000 })

            let body = await page.locator('body').innerText()
            check(body.includes('Brass-Latched Research Case'), 'Research Case missing')
            check(!body.includes('Carefully Labeled Moon Jar'), 'Moon Jar present')
            check(!body.includes("use Help and I'll walk you through it"), 'Tutorial guidance present')
            check(await page.locator('.weed-goblins-game__guidance-bubble').count() === 0, 'Automatic guidance bubble present')
            check(!/out of the story|back to the story|back to the Highlands|rules aside/i.test(body), 'Announced mode switch present')
            check(!body.includes('\u2014') && !body.includes('\u2013'), 'Forbidden dash character present')

            await page.getByRole('button', { name: 'Continue' }).click()
            const composer = page.locator('.weed-goblins-game__composer input')
            await composer.waitFor()
            await composer.fill('Fenna')
            await page.locator('.weed-goblins-game__send-button').click()
            await page.getByRole('button', { name: 'Human' }).waitFor()
            await page.getByRole('button', { name: 'Human' }).click()
            await page.getByText(/Now give me the practical part:/i).waitFor()
            await page.getByRole('button', { name: 'Sword' }).click()
            await page.getByRole('button', { name: 'Highland Tracker' }).waitFor({ timeout: 10000 })
            await page.getByRole('button', { name: 'Highland Tracker' }).click()
            await page.getByText(/Last pass: what pronouns should I use/i).waitFor()
            await page.getByRole('button', { name: 'They' }).click()
            const lookChoice = page.locator('.weed-goblins-game__quick-reply').first()
            await lookChoice.waitFor()
            await lookChoice.click()

            await page.getByText(/The goblin tracks carry on through Windcut Trail until the ground drops toward Rattlebridge/i).waitFor()
            body = await page.locator('body').innerText()
            check(!body.includes('What do you want to do?'), 'Reflexive route question present')
            check(!body.includes('Fenna. All right.'), 'Name echo present')
            check(!body.includes('Human. All right.'), 'Race echo present')
            check(!body.includes('A sword. Okay.'), 'Weapon echo present')

            await page.getByRole('button', { name: /Quiet Crossing/ }).click()
            await page.getByText(/Defense check, DC 12;/i).waitFor()
            body = await page.locator('body').innerText()
            check(!/out of the story|back to the story|rules aside/i.test(body), 'Rules announcement present')
            await page.getByRole('button', { name: /ROLL D20/i }).click()

            const npcAction = page.getByRole('button', { name: /Outlast / })
            await npcAction.waitFor({ timeout: 25000 })
            await npcAction.click()
            await page.getByText(/Defense check, DC 12;/i).last().waitFor()
            await page.getByRole('button', { name: /ROLL D20/i }).click()
            await page.getByRole('button', { name: /Keep Nib safe/i }).waitFor({ timeout: 25000 })

            body = await page.locator('body').innerText()
            check(!body.includes('\u2014') && !body.includes('\u2013'), 'Forbidden dash character present after NPC interaction')
            check(!/Great choice|I love that|Perfect\.?$/im.test(body), 'Automatic affirmation present')
            check(await page.locator('.weed-goblins-game__guidance-bubble').count() === 0, 'Automatic guidance returned')
            check(await page.locator('.weed-goblins-game__error').count() === 0, 'Visible game error present')
            check(narrationStatuses.length > 0, 'No narration Worker calls observed')
            check(narrationStatuses.every((status) => status === 200), `Narration failures: ${JSON.stringify(narrationStatuses)}`)
            check(page.url() === url, `Playthrough left exact URL: ${page.url()}`)
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth)
            check(!overflow, '390px horizontal overflow')

            console.log(`LIVE_URL=${page.url()}`)
            console.log(`LIVE_REVISION=${response.headers()['x-wg-playtest-revision']}`)
            console.log(`NARRATION_CALLS=${narrationStatuses.length}`)
            console.log('OPENING=PASS')
            console.log('CHARACTER_CREATION=PASS')
            console.log('FIRST_RULE_CHECK=PASS')
            console.log('FIRST_NPC_INTERACTION=PASS')
            console.log('EXACT_URL_BEHAVIOR_ARCHITECTURE=PASS')
          } finally {
            await browser.close()
          }
          EOF
          node .validation/wg-r20-live-proof.mjs
