name: Chapter One Static Integration

on:
  push:
    branches:
      - feature/weed-goblins-session-zero

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weed-goblins-session-zero
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patches
        run: python scripts/chapter-one-static-integration.py
      - name: Install dependencies
        run: npm install
      - name: Run Chapter 1 static tests
        run: node --test src/features/games/weed-goblins/weedGoblinsChapterOneStatic.test.js
      - name: Build production bundle
        run: npm run build
      - name: Commit validated integration and remove temporary tooling
        run: |
          rm scripts/chapter-one-static-integration.py
          rm .github/workflows/chapter-one-static-integration.yml
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add -A
          git commit -m "Implement static Chapter 1 architecture [ch1-static-integrated]"
          git push origin feature/weed-goblins-session-zero
