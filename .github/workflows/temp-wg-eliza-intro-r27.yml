name: Weed Goblins Eliza Intro Restore R27

on:
  push:
    branches:
      - temp/weed-goblins-eliza-intro-static-copy-20260809
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weed-goblins-eliza-intro-r27
  cancel-in-progress: true

jobs:
  verify-deploy-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLAYTEST_URL: https://my420journal-wg-playtest-1-3.casevoice-ai.workers.dev/games/weed-goblins
      EXPECTED_REVISION: eliza-intro-restore-r27
      NEW_LINE_ONE: "I'm Eliza. I'll be running everything from here, the goblins, the weather, whoever's dumb enough to get in your way. Tell me what you're trying to do and I'll tell you what happens."
      NEW_LINE_TWO: "Sometimes I'll toss out a couple of obvious moves so you're not staring at a blank box. Ignore them if you've got something better."
      OLD_LINE_ONE: "I'm Eliza, and I'll be running the game. You tell me what your character tries; when a rule matters, I'll explain it right where it comes up."
      OLD_LINE_TWO: "I'll usually put a few obvious choices in front of you so you're never left guessing what you can try, but they're suggestions, not limits. If you want something else, just say what you're doing."

    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/weed-goblins-eliza-intro-static-copy-20260809
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify protected feature branch and private base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/weed-goblins-session-zero temp/weed-goblins-check-type-audit-20260809
          test "$(git rev-parse origin/feature/weed-goblins-session-zero)" = "a9021d750698d2b9b211cf3227dca676fe1da11b"
          test "$(git rev-parse origin/feature/weed-goblins-session-zero:src/features/games/weed-goblins/weedGoblinsEngine.js)" = "02b3bdc10a32687fed81e230525b418567645b6a"
          test "$(git rev-parse origin/temp/weed-goblins-check-type-audit-20260809)" = "a55728486eb2bc19191b9ad2c9618c19918d74f9"

      - name: Apply effective private build and restore migration
        shell: bash
        run: |
          set -euo pipefail
          python .playtest/apply_human_gm_prose_v3.py
          python .playtest/apply_approved_kings_stash_opening.py
          git fetch origin temp/weed-goblins-narration-voice-audit-20260809
          test "$(git rev-parse origin/temp/weed-goblins-narration-voice-audit-20260809)" = "c7f67befc2cf5175787d615ada1e3a1017294f48"
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/legacyChapterOne.js > server/weed-goblins-narration-worker/legacyChapterOne.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:src/features/games/weed-goblins/weedGoblinsNarrationValidation.js > src/features/games/weed-goblins/weedGoblinsNarrationValidation.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/voice-audit.test.js > server/weed-goblins-narration-worker/voice-audit.test.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/index.test.js > server/weed-goblins-narration-worker/index.test.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/story-beats.test.js > server/weed-goblins-narration-worker/story-beats.test.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:src/features/games/weed-goblins/weedGoblinsAiComplication.test.js > src/features/games/weed-goblins/weedGoblinsAiComplication.test.js
          python .playtest/apply_research_rules.py
          python .playtest/apply_behavior_architecture.py
          python .playtest/apply_behavior_architecture_compat.py
          python .playtest/apply_post_rattlebridge_gameplay_fixes.py
          python .playtest/apply_choice_restore_hardening.py
          python .playtest/apply_restart_busy_hardening.py
          python .playtest/apply_restore_die_fix.py
          python .playtest/apply_check_type_audit_v2.py
          python .playtest/apply_eliza_intro_restore_migration.py
          git diff --check
          grep -F "$NEW_LINE_ONE" src/features/games/weed-goblins/weedGoblinsEngine.js
          grep -F "$NEW_LINE_TWO" src/features/games/weed-goblins/weedGoblinsEngine.js
          grep -F "migrateElizaIntroText(message.text, 1000)" src/features/games/weed-goblins/weedGoblinsPersistenceChapterOne.js
          grep -F "migrateElizaIntroText(line, 600)" src/features/games/weed-goblins/weedGoblinsPersistenceChapterOne.js

      - name: Run regressions and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test \
            src/features/games/weed-goblins/weedGoblinsCheckTypeAudit.test.js \
            src/features/games/weed-goblins/weedGoblinsPersistenceDieRestore.test.js \
            src/features/games/weed-goblins/weedGoblinsPostRattlebridge.test.js
          python - <<'PY'
          from pathlib import Path
          path = Path('public/_headers')
          text = path.read_text()
          old = 'X-WG-Playtest-Revision: guidance-removed-r18'
          new = 'X-WG-Playtest-Revision: eliza-intro-restore-r27'
          if old not in text:
              raise SystemExit('old playtest revision marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
          npm run build
          rm -f dist/_redirects

      - name: Deploy private playtest host only
        run: npx wrangler@latest deploy --config .playtest/host/wrangler.jsonc

      - name: Wait for exact live revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            headers="$(curl -sS -D - -o /tmp/wg-r27.html "$PLAYTEST_URL" || true)"
            normalized="$(printf '%s' "$headers" | tr '[:upper:]' '[:lower:]' | tr -d '\r')"
            if printf '%s' "$normalized" | grep -Fq "x-wg-playtest-revision: $EXPECTED_REVISION"; then
              printf '%s\n' "$normalized" | grep -F "cache-control: no-store"
              echo "LIVE_ROUTE_REVISION=$EXPECTED_REVISION"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify stale saved intro self-repairs and screenshot
        shell: bash
        run: |
          mkdir -p playtest-artifacts
          cat > wg-r27-live.mjs <<'EOF'
          import { chromium } from 'playwright'

          const url = process.env.PLAYTEST_URL
          const expectedRevision = process.env.EXPECTED_REVISION
          const newOne = process.env.NEW_LINE_ONE
          const newTwo = process.env.NEW_LINE_TWO
          const oldOne = process.env.OLD_LINE_ONE
          const oldTwo = process.env.OLD_LINE_TWO
          const check = (condition, message) => { if (!condition) throw new Error(message) }

          const browser = await chromium.launch({ headless: true })
          try {
            const context = await browser.newContext({ viewport: { width: 1050, height: 923 } })
            await context.addInitScript(() => localStorage.clear())
            const page = await context.newPage()
            const response = await page.goto(url, { waitUntil: 'networkidle' })
            check(response?.url() === url, `Wrong final URL: ${response?.url()}`)
            check(response.headers()['x-wg-playtest-revision'] === expectedRevision, 'Wrong live revision')

            await page.getByRole('button', { name: 'Continue' }).waitFor({ timeout: 30000 })
            await page.getByRole('button', { name: 'Continue' }).click()
            await page.getByText(newOne, { exact: true }).waitFor({ timeout: 30000 })
            await page.getByText(newTwo, { exact: true }).waitFor({ timeout: 30000 })
            console.log('FRESH_NEW_INTRO=PASS')

            const replacements = await page.evaluate(({ newOne, newTwo, oldOne, oldTwo }) => {
              let count = 0
              for (let i = 0; i < localStorage.length; i += 1) {
                const key = localStorage.key(i)
                if (!key) continue
                const value = localStorage.getItem(key)
                if (!value || !value.includes('weed_goblins_active_run')) continue
                let next = value
                const before = next
                next = next.split(newOne).join(oldOne).split(newTwo).join(oldTwo)
                if (next !== before) {
                  localStorage.setItem(key, next)
                  count += 1
                }
              }
              return count
            }, { newOne, newTwo, oldOne, oldTwo })
            check(replacements > 0, 'Could not seed stale saved intro copy')

            await page.reload({ waitUntil: 'networkidle' })
            await page.getByText(newOne, { exact: true }).waitFor({ timeout: 30000 })
            await page.getByText(newTwo, { exact: true }).waitFor({ timeout: 30000 })
            const body = await page.locator('body').innerText()
            check(!body.includes(oldOne), 'Old line one survived restored-session migration')
            check(!body.includes(oldTwo), 'Old line two survived restored-session migration')
            console.log('STALE_SAVE_INTRO_MIGRATION=PASS')

            await page.screenshot({ path: 'playtest-artifacts/eliza-intro-restored-r27.png', fullPage: true })
            console.log(`LIVE_URL=${page.url()}`)
            console.log(`LIVE_REVISION=${response.headers()['x-wg-playtest-revision']}`)
            console.log('ELIZA_INTRO_RESTORE_R27_LIVE=PASS')
          } finally {
            await browser.close()
          }
          EOF
          node wg-r27-live.mjs

      - name: Upload repaired intro screenshot
        uses: actions/upload-artifact@v4
        with:
          name: weed-goblins-eliza-intro-r27
          path: playtest-artifacts/eliza-intro-restored-r27.png
          if-no-files-found: error
