name: Phase 1 validation

on:
  push:
    branches:
      - privacy/local-profile-no-email
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Show full dependency audit
        run: npm audit --audit-level=high || true

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
