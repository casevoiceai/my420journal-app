name: Phase 1 validation

on:
  push:
    branches:
      - privacy/local-profile-no-email
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 1 branch
        uses: actions/checkout@v4
        with:
          ref: privacy/local-profile-no-email

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply already-approved safe dependency repair
        run: npm audit fix

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit refreshed lockfile if needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "casevoiceai"
          git config user.email "casevoice.ai@gmail.com"
          git add package-lock.json
          git commit -m "Bring Phase 1 onto audited dependency lockfile"
          git push origin HEAD:privacy/local-profile-no-email
