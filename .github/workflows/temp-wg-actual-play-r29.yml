name: Weed Goblins Actual Play Eliza R29

on:
  push:
    branches:
      - temp/weed-goblins-actual-play-register-20260810
    paths:
      - .github/workflows/temp-wg-actual-play-r29.yml
      - .playtest/apply_actual_play_register.py
      - .playtest/apply_actual_play_register_conflicts.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weed-goblins-actual-play-r29
  cancel-in-progress: true

jobs:
  verify-deploy-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLAYTEST_URL: https://my420journal-wg-playtest-1-3.casevoice-ai.workers.dev/games/weed-goblins
      EXPECTED_REVISION: eliza-actual-play-r29
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/weed-goblins-actual-play-register-20260810
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify protected feature branch and private base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/weed-goblins-session-zero temp/weed-goblins-check-type-audit-20260809 temp/weed-goblins-narration-voice-audit-20260809
          test "$(git rev-parse origin/feature/weed-goblins-session-zero)" = "a9021d750698d2b9b211cf3227dca676fe1da11b"
          test "$(git rev-parse origin/temp/weed-goblins-check-type-audit-20260809)" = "a55728486eb2bc19191b9ad2c9618c19918d74f9"
          test "$(git rev-parse origin/temp/weed-goblins-narration-voice-audit-20260809)" = "c7f67befc2cf5175787d615ada1e3a1017294f48"

      - name: Apply effective private build and actual-play register
        shell: bash
        run: |
          set -euo pipefail
          python .playtest/apply_human_gm_prose_v3.py
          python .playtest/apply_approved_kings_stash_opening.py
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/legacyChapterOne.js > server/weed-goblins-narration-worker/legacyChapterOne.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:src/features/games/weed-goblins/weedGoblinsNarrationValidation.js > src/features/games/weed-goblins/weedGoblinsNarrationValidation.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/voice-audit.test.js > server/weed-goblins-narration-worker/voice-audit.test.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/index.test.js > server/weed-goblins-narration-worker/index.test.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:server/weed-goblins-narration-worker/story-beats.test.js > server/weed-goblins-narration-worker/story-beats.test.js
          git show origin/temp/weed-goblins-narration-voice-audit-20260809:src/features/games/weed-goblins/weedGoblinsAiComplication.test.js > src/features/games/weed-goblins/weedGoblinsAiComplication.test.js
          python .playtest/apply_research_rules.py
          python .playtest/apply_behavior_architecture.py
          python .playtest/apply_behavior_architecture_compat.py
          python .playtest/apply_post_rattlebridge_gameplay_fixes.py
          python .playtest/apply_choice_restore_hardening.py
          python .playtest/apply_restart_busy_hardening.py
          python .playtest/apply_restore_die_fix.py
          python .playtest/apply_check_type_audit_v2.py
          python .playtest/apply_eliza_intro_restore_migration.py
          python .playtest/apply_actual_play_register.py
          python .playtest/apply_actual_play_register_conflicts.py
          git diff --check

      - name: Verify actual-play voice replaced literary contract
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            server/weed-goblins-narration-worker/legacyChapterOne.js \
            server/weed-goblins-narration-worker/chapterTwo.js \
            server/weed-goblins-narration-worker/chapterThree.js; do
            grep -F 'ACTUAL PLAY CORE VOICE' "$file"
            grep -F 'Talk directly with the player like a GM running the game live' "$file"
            grep -F 'Never introduce yourself, name yourself, explain your role, or announce how the game works.' "$file"
            grep -F 'Narration can contain the joke.' "$file"
            grep -F 'Spoken messiness is allowed.' "$file"
            grep -F 'Cut atmospheric density hard.' "$file"
            ! grep -F 'patient, lush, curious' "$file"
            ! grep -F 'one or two focused sentences' "$file"
            ! grep -F 'melancholy, quiet, uncanny' "$file"
            ! grep -F 'slower and stranger' "$file"
          done
          grep -F "Okay, so you've been chasing five goblins uphill for about an hour." src/features/games/weed-goblins/weedGoblinsEngine.js
          grep -F "Calling it a bridge is generous." src/features/games/weed-goblins/weedGoblinsEngine.js
          grep -F "Somebody kept having ideas." src/features/games/weed-goblins/weedGoblinsEngine.js
          grep -F "before the bottle caps start screaming" src/features/games/weed-goblins/weedGoblinsEngine.js
          ! grep -F "I'm Eliza" src/features/games/weed-goblins/weedGoblinsEngine.js
          ! grep -F "I'll be running the game" src/features/games/weed-goblins/weedGoblinsEngine.js
          ! grep -F 'Do not optimize for concision. Optimize for immersion.' server/weed-goblins-narration-worker/legacyChapterOne.js
          echo ACTUAL_PLAY_STRUCTURE_ASSERTIONS=PASS

      - name: Install dependencies, run targeted regressions, and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test \
            server/weed-goblins-narration-worker/index.test.js \
            server/weed-goblins-narration-worker/story-beats.test.js \
            src/features/games/weed-goblins/weedGoblinsAiComplication.test.js \
            src/features/games/weed-goblins/weedGoblinsCheckTypeAudit.test.js \
            src/features/games/weed-goblins/weedGoblinsPersistenceDieRestore.test.js \
            src/features/games/weed-goblins/weedGoblinsPostRattlebridge.test.js
          python - <<'PY'
          from pathlib import Path
          path = Path('public/_headers')
          text = path.read_text()
          old = 'X-WG-Playtest-Revision: guidance-removed-r18'
          new = 'X-WG-Playtest-Revision: eliza-actual-play-r29'
          if old not in text:
              raise SystemExit('old playtest revision marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
          npm run build
          rm -f dist/_redirects

      - name: Deploy Chapter 1-3 narration to staging only
        working-directory: server/weed-goblins-narration-worker
        run: npx wrangler@latest deploy --env staging

      - name: Deploy private playtest host only
        run: npx wrangler@latest deploy --config .playtest/host/wrangler.jsonc

      - name: Verify exact live revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            headers="$(curl -sS -D - -o /tmp/wg-r29.html "$PLAYTEST_URL" || true)"
            normalized="$(printf '%s' "$headers" | tr '[:upper:]' '[:lower:]' | tr -d '\r')"
            if printf '%s' "$normalized" | grep -Fq "x-wg-playtest-revision: $EXPECTED_REVISION"; then
              printf '%s\n' "$normalized" | grep -F 'cache-control: no-store'
              echo "LIVE_ROUTE_REVISION=$EXPECTED_REVISION"
              exit 0
            fi
            sleep 2
          done
          echo 'Expected actual-play revision never appeared at exact game URL' >&2
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Prove opening and Rattlebridge at live URL
        shell: bash
        run: |
          mkdir -p playtest-artifacts
          cat > .validation/wg-r29-live.mjs <<'EOF'
          import { chromium } from 'playwright'

          const url = process.env.PLAYTEST_URL
          const check = (condition, message) => { if (!condition) throw new Error(message) }
          const openingOne = "Okay, so you've been chasing five goblins uphill for about an hour. They stole your Brass-Latched Research Case, they are not especially good at escaping with it, and the trail is honestly doing most of the work for you."
          const openingTwo = "There are little bootprints all over the mud, a drag mark from the case, and one extremely clear goblin faceprint where somebody apparently lost an argument with the hill. They got back up. The faceprint did not."
          const rattleOne = "A little farther up, the trail runs straight into Rattlebridge. Calling it a bridge is generous. It's some planks, two ropes, and an absolutely unreasonable number of bottle caps tied along the rails as an alarm system. Somebody kept having ideas."
          const rattleTwo = "There's movement on the far side, tucked behind one of the posts. They haven't seen you yet. You can sneak across, just book it before the bottle caps start screaming, or try something else."

          const browser = await chromium.launch({ headless: true })
          try {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } })
            await context.addInitScript(() => localStorage.clear())
            const page = await context.newPage()
            const response = await page.goto(url, { waitUntil: 'networkidle' })
            check(response?.url() === url, `Wrong final URL: ${response?.url()}`)
            await page.getByText(openingOne, { exact: true }).waitFor({ timeout: 30000 })
            await page.getByText(openingTwo, { exact: true }).waitFor({ timeout: 30000 })
            let body = await page.locator('body').innerText()
            check(!body.includes("I'm Eliza"), 'Eliza self-introduction remained in live opening')
            check(!body.includes('By the time the road finally gives up'), 'literary opening remained live')

            await page.getByRole('button', { name: 'Continue' }).click()
            const composer = page.locator('.weed-goblins-game__composer input')
            await composer.waitFor({ timeout: 30000 })
            await composer.fill('Fenna')
            await page.locator('.weed-goblins-game__send-button').click()
            await page.getByRole('button', { name: 'Human' }).waitFor()
            await page.getByRole('button', { name: 'Human' }).click()
            await page.getByText(/Now give me the practical part:/i).waitFor()
            await page.getByRole('button', { name: 'Sword' }).click()
            await page.getByRole('button', { name: 'Highland Tracker' }).waitFor({ timeout: 10000 })
            await page.getByRole('button', { name: 'Highland Tracker' }).click()
            await page.getByText(/Last pass: what pronouns should I use/i).waitFor()
            await page.getByRole('button', { name: 'They' }).click()
            await page.locator('.weed-goblins-game__quick-reply').first().waitFor()
            await page.locator('.weed-goblins-game__quick-reply').first().click()

            await page.getByText(rattleOne, { exact: true }).waitFor({ timeout: 30000 })
            await page.getByText(rattleTwo, { exact: true }).waitFor({ timeout: 30000 })
            body = await page.locator('body').innerText()
            check(!body.includes('The goblin tracks carry on through Windcut Trail until the ground drops toward Rattlebridge'), 'old Rattlebridge prose remained live')
            check(!body.includes("I'm Eliza"), 'Eliza self-introduction appeared before Rattlebridge')

            await page.screenshot({ path: 'playtest-artifacts/eliza-actual-play-r29.png', fullPage: true })
            console.log('LIVE_OPENING_ACTUAL_PLAY=PASS')
            console.log('LIVE_RATTLEBRIDGE_ACTUAL_PLAY=PASS')
            console.log('LIVE_SELF_INTRO_ABSENT=PASS')
            console.log(`LIVE_URL=${page.url()}`)
          } finally {
            await browser.close()
          }
          EOF
          node .validation/wg-r29-live.mjs

      - name: Upload live proof
        uses: actions/upload-artifact@v4
        with:
          name: weed-goblins-eliza-actual-play-r29
          path: playtest-artifacts/eliza-actual-play-r29.png
          if-no-files-found: error
