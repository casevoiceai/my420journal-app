name: Weed Goblins Live URL Proof

on:
  push:
    branches:
      - temp/weed-goblins-human-playtest-1-3-20260809

permissions:
  contents: read

jobs:
  verify-live-url:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYTEST_URL: https://my420journal-wg-playtest-1-3.casevoice-ai.workers.dev/games/weed-goblins
      EXPECTED_REVISION: guidance-removed-r18
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for exact route deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            headers="$(curl -sS -D - -o /tmp/wg-playtest.html "$PLAYTEST_URL" || true)"
            normalized="$(printf '%s' "$headers" | tr '[:upper:]' '[:lower:]' | tr -d '\r')"
            if printf '%s' "$normalized" | grep -Fq "x-wg-playtest-revision: $EXPECTED_REVISION"; then
              printf '%s\n' "$normalized" | grep -F "cache-control: no-store"
              echo "LIVE_ROUTE_REVISION=$EXPECTED_REVISION"
              exit 0
            fi
            echo "Waiting for exact route revision, attempt $attempt"
            sleep 2
          done
          echo "Expected playtest revision never appeared at $PLAYTEST_URL" >&2
          exit 1

      - name: Install Chromium
        shell: bash
        run: |
          mkdir -p /tmp/wg-live-proof
          cd /tmp/wg-live-proof
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify exact live browser route
        shell: bash
        run: |
          cd /tmp/wg-live-proof
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright'

          const url = process.env.PLAYTEST_URL
          const expectedRevision = process.env.EXPECTED_REVISION
          const forbidden = "Whenever you're ready, we'll build your character and get onto the trail. If anything doesn't make sense, use Help and I'll walk you through it."
          const check = (condition, message) => {
            if (!condition) throw new Error(message)
          }

          const browser = await chromium.launch({ headless: true })
          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
            const response = await page.goto(url, { waitUntil: 'networkidle' })
            check(response, 'No document response returned for exact playtest URL')
            check(response.url() === url, `Unexpected final URL: ${response.url()}`)
            check(response.headers()['x-wg-playtest-revision'] === expectedRevision, `Wrong revision header: ${response.headers()['x-wg-playtest-revision'] || 'missing'}`)
            check((response.headers()['cache-control'] || '').includes('no-store'), `Exact route is cacheable: ${response.headers()['cache-control'] || 'missing'}`)
            await page.getByText(/By the time the road finally gives up/i).waitFor({ timeout: 15000 })
            check(await page.locator('.weed-goblins-game__guidance-bubble').count() === 0, 'Automatic guidance bubble is still rendered at the opening')
            const body = await page.locator('body').innerText()
            check(!body.includes(forbidden), 'Forbidden automatic guidance text is still visible')
            check(!body.includes("use Help and I'll walk you through it"), 'Tutorial Help language is still visible')
            console.log(`LIVE_URL=${response.url()}`)
            console.log(`LIVE_REVISION=${response.headers()['x-wg-playtest-revision']}`)
            console.log('AUTOMATIC_GUIDANCE_BUBBLES=0')
            console.log('LIVE_URL_PROOF=PASS')
          } finally {
            await browser.close()
          }
          EOF
          node verify.mjs
