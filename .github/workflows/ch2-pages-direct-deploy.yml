name: Temporary Chapter 2 Pages Direct Deploy

on:
  push:
    branches:
      - temp/ch2-pages-direct-deploy-20260809
    paths:
      - '.github/workflows/ch2-pages-direct-deploy.yml'

permissions:
  contents: write

jobs:
  direct-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: feature/weed-goblins-session-zero

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build exact feature head
        run: |
          test "$(git rev-parse HEAD)" = "a048339cd8e59a91dad0cfb3a2acdc1524421623"
          npm ci
          npm run build

      - name: Attempt direct non-production Pages preview deployment
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/ch2-direct
          npx wrangler@latest pages deploy dist \
            --project-name my420journal-app \
            --branch wg-ch2-validation \
            --commit-hash a048339cd8e59a91dad0cfb3a2acdc1524421623 \
            --commit-dirty=false 2>&1 | tee /tmp/ch2-direct/deploy.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Save sanitized result on temporary branch
        if: always()
        shell: bash
        run: |
          git fetch origin temp/ch2-pages-direct-deploy-20260809
          git checkout -B temp/ch2-pages-direct-deploy-20260809 origin/temp/ch2-pages-direct-deploy-20260809
          mkdir -p .validation
          python - <<'PY'
          import re, pathlib
          p=pathlib.Path('/tmp/ch2-direct/deploy.log')
          text=p.read_text(errors='replace') if p.exists() else 'NO_DEPLOY_LOG\n'
          text=re.sub(r'(?i)(authorization:\s*bearer\s+)\S+', r'\1[REDACTED]', text)
          text=re.sub(r'(?i)(api[_ -]?token[^\n:=]*[:=]\s*)\S+', r'\1[REDACTED]', text)
          pathlib.Path('.validation/pages-direct-deploy.log').write_text(text)
          PY
          printf 'direct_pages_deploy_exit=%s\n' '${{ steps.deploy.outputs.exit_code }}' > .validation/pages-direct-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .validation/pages-direct-deploy.log .validation/pages-direct-result.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record direct Pages preview attempt [skip ci]'
            git push origin HEAD:temp/ch2-pages-direct-deploy-20260809
          fi

      - name: Fail only if direct deployment failed
        if: steps.deploy.outputs.exit_code != '0'
        run: exit 1
