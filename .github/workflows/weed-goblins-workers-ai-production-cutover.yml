name: Weed Goblins Workers AI production cutover

on:
  push:
    branches:
      - remove-anthropic/weed-goblins-workers-ai

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_PROXY_SECRET: ${{ secrets.WEED_GOBLINS_PROXY_SECRET }}
    steps:
      - name: Check out approved feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require production credentials before deployment
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 41; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING'; exit 42; }
          test -n "$PROD_PROXY_SECRET" || { echo 'WEED_GOBLINS_PROXY_SECRET_GITHUB_SECRET_MISSING'; exit 43; }
          echo 'Required production credentials are present.'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Re-run test and build gate
        shell: bash
        run: |
          npm ci
          npm test
          npm run build
          git diff --check
          if git grep -niE 'anthropic|claude' -- server/weed-goblins-narration-worker; then
            echo 'Forbidden provider reference remains in Weed Goblins narration Worker.'
            exit 44
          fi

      - name: Deploy production narration Worker
        id: deploy
        working-directory: server/weed-goblins-narration-worker
        shell: bash
        run: |
          set -o pipefail
          npx wrangler@latest deploy 2>&1 | tee /tmp/weed-goblins-production-deploy.log
          worker_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/weed-goblins-production-deploy.log | tail -1 | tr -d '\r')
          test -n "$worker_url" || { echo 'PRODUCTION_WORKER_URL_NOT_FOUND'; exit 45; }
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Production Worker URL resolved: $worker_url"

      - name: Smoke test production Workers AI
        id: smoke
        shell: bash
        env:
          PROD_WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set +e
          unauth_status=$(curl --silent --show-error --max-time 60 \
            --output /tmp/weed-goblins-prod-unauth.json \
            --write-out '%{http_code}' \
            --request POST "$PROD_WORKER_URL" \
            --header 'Content-Type: application/json' \
            --data '{"moment":"natural-one-complication","outcome":"complication"}')
          if [ "$unauth_status" != '401' ]; then
            echo "UNAUTHORIZED_SMOKE_HTTP_$unauth_status"
            cat /tmp/weed-goblins-prod-unauth.json
            echo 'smoke_failed=true' >> "$GITHUB_OUTPUT"
            exit 51
          fi

          status=$(curl --silent --show-error --max-time 60 \
            --output /tmp/weed-goblins-prod-response.json \
            --write-out '%{http_code}' \
            --request POST "$PROD_WORKER_URL" \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $PROD_PROXY_SECRET" \
            --data '{"moment":"natural-one-complication","outcome":"complication","sceneId":"choose-route","actionId":"route:ridge","stat":"strength","dc":12,"rolls":[1],"selectedRoll":1,"troubleBefore":0,"troubleAfter":2,"fictionalStolenItem":"the Amber Field Satchel","fictionalGoblinName":"Professor Grub","narrationTier":"normal"}')
          if [ "$status" != '200' ]; then
            echo "PRODUCTION_SMOKE_HTTP_$status"
            cat /tmp/weed-goblins-prod-response.json
            echo 'smoke_failed=true' >> "$GITHUB_OUTPUT"
            exit 52
          fi

          node <<'NODE'
          const fs = require('fs')
          const j = JSON.parse(fs.readFileSync('/tmp/weed-goblins-prod-response.json', 'utf8'))
          if (!j.text || typeof j.text !== 'string') process.exit(53)
          if (j.model !== '@cf/meta/llama-3.3-70b-instruct-fp8-fast') process.exit(54)
          if (/anthropic|claude/i.test(JSON.stringify(j))) process.exit(55)
          console.log('PRODUCTION_WORKERS_AI_SMOKE_OK')
          console.log(`MODEL=${j.model}`)
          NODE
          node_status=$?
          if [ "$node_status" -ne 0 ]; then
            echo 'smoke_failed=true' >> "$GITHUB_OUTPUT"
            exit "$node_status"
          fi
          echo 'smoke_failed=false' >> "$GITHUB_OUTPUT"

      - name: Roll back production if smoke failed
        if: failure() && steps.deploy.outcome == 'success'
        working-directory: server/weed-goblins-narration-worker
        shell: bash
        run: |
          echo 'Production smoke failed. Rolling back to previous Worker version.'
          npx wrangler@latest rollback --message 'Automated rollback after failed Workers AI production smoke test'

      - name: Remove obsolete Anthropic Worker secret
        if: success()
        working-directory: server/weed-goblins-narration-worker
        shell: bash
        run: |
          printf 'y\n' | npx wrangler@latest secret delete WEED_GOBLINS_ANTHROPIC_API_KEY
          npx wrangler@latest secret list > /tmp/weed-goblins-production-secrets.json
          if grep -q 'WEED_GOBLINS_ANTHROPIC_API_KEY' /tmp/weed-goblins-production-secrets.json; then
            echo 'ANTHROPIC_WORKER_SECRET_STILL_PRESENT'
            exit 61
          fi
          echo 'Obsolete Anthropic Worker secret removed.'

      - name: Re-smoke production after Anthropic secret removal
        if: success()
        shell: bash
        env:
          PROD_WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          status=$(curl --silent --show-error --max-time 60 \
            --output /tmp/weed-goblins-prod-post-delete.json \
            --write-out '%{http_code}' \
            --request POST "$PROD_WORKER_URL" \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $PROD_PROXY_SECRET" \
            --data '{"moment":"natural-one-complication","outcome":"complication","sceneId":"choose-route","actionId":"route:ridge","stat":"strength","dc":12,"rolls":[1],"selectedRoll":1,"troubleBefore":0,"troubleAfter":2,"fictionalStolenItem":"the Amber Field Satchel","fictionalGoblinName":"Professor Grub","narrationTier":"normal"}')
          test "$status" = '200' || { echo "POST_DELETE_SMOKE_HTTP_$status"; cat /tmp/weed-goblins-prod-post-delete.json; exit 62; }
          node <<'NODE'
          const fs = require('fs')
          const j = JSON.parse(fs.readFileSync('/tmp/weed-goblins-prod-post-delete.json', 'utf8'))
          if (!j.text || typeof j.text !== 'string') process.exit(63)
          if (j.model !== '@cf/meta/llama-3.3-70b-instruct-fp8-fast') process.exit(64)
          if (/anthropic|claude/i.test(JSON.stringify(j))) process.exit(65)
          console.log('PRODUCTION_POST_DELETE_SMOKE_OK')
          NODE

      - name: Remove temporary production cutover workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/weed-goblins-workers-ai-production-cutover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Weed Goblins production cutover workflow'
          git push origin HEAD:${GITHUB_REF_NAME}
