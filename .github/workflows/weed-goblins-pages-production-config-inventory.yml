name: Weed Goblins Pages production config inventory

on:
  push:
    branches:
      - remove-anthropic/weed-goblins-workers-ai

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 41; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING'; exit 42; }

      - name: List Pages project names
        shell: bash
        run: |
          curl --silent --show-error --fail \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            > /tmp/pages-projects.json
          node <<'NODE'
          const fs = require('fs')
          const body = JSON.parse(fs.readFileSync('/tmp/pages-projects.json', 'utf8'))
          if (!body.success || !Array.isArray(body.result)) process.exit(51)
          for (const project of body.result) {
            if (/420|journal/i.test(project.name || '')) {
              console.log(`PAGES_PROJECT=${project.name}`)
            }
          }
          NODE

      - name: Inspect my420journal Pages variable names and types only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const body = JSON.parse(fs.readFileSync('/tmp/pages-projects.json', 'utf8'))
          const candidates = body.result.filter((project) => /420|journal/i.test(project.name || ''))
          if (candidates.length !== 1) {
            console.log(`MATCHING_PROJECT_COUNT=${candidates.length}`)
            for (const p of candidates) console.log(`MATCHING_PROJECT=${p.name}`)
            process.exit(52)
          }
          fs.writeFileSync('/tmp/project-name.txt', candidates[0].name)
          NODE
          project_name=$(cat /tmp/project-name.txt)
          curl --silent --show-error --fail \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project_name" \
            > /tmp/pages-project.json
          node <<'NODE'
          const fs = require('fs')
          const body = JSON.parse(fs.readFileSync('/tmp/pages-project.json', 'utf8'))
          if (!body.success || !body.result) process.exit(53)
          const configs = body.result.deployment_configs || {}
          for (const envName of ['production', 'preview']) {
            const vars = configs[envName]?.env_vars || {}
            for (const [name, meta] of Object.entries(vars)) {
              if (/WEED_GOBLINS|JOURNAL_ACCESS/i.test(name)) {
                const type = meta && typeof meta === 'object' ? meta.type : typeof meta
                const hasValue = Boolean(meta && typeof meta === 'object' && typeof meta.value === 'string' && meta.value.length > 0)
                console.log(`${envName.toUpperCase()}_VAR=${name};TYPE=${type};VALUE_AVAILABLE_TO_API=${hasValue}`)
              }
            }
          }
          NODE

      - name: Remove temporary inventory workflow
        if: always()
        shell: bash
        run: |
          git rm .github/workflows/weed-goblins-pages-production-config-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Pages production config inventory workflow'
          git push origin HEAD:${GITHUB_REF_NAME}
