name: Global homepage universalization

on:
  push:
    branches:
      - marketing/global-home-universal-v1
    paths:
      - .github/workflows/global-home-universalization.yml

permissions:
  contents: write

jobs:
  patch-validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout universal-home branch
        uses: actions/checkout@v4
        with:
          ref: marketing/global-home-universal-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact global-home copy corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_count(pathname, old, new, expected=1):
              path = Path(pathname)
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{pathname}: expected {expected} occurrence(s), found {count}: {old!r}')
              path.write_text(text.replace(old, new))

          replace_count('src/marketing/MarketingHero.jsx', 'Stop guessing at the dispensary.', 'Remember what you tried.')
          replace_count(
              'src/marketing/MarketingHero.jsx',
              'Log what you tried. See what your own notes show. <br />\n            Your private journal is stored locally in this browser.',
              'Record product details and your own observations. <br />\n            Your journal entries and private notes are stored locally in this browser.',
          )
          replace_count('src/marketing/MarketingHero.jsx', 'Start your research', 'Open My420Journal')
          replace_count('src/marketing/MarketingHero.jsx', 'Learn how it works below', 'See how the journal works')

          replace_count('src/marketing/MarketingFeatures.jsx', '<span>Small habits.</span>{\' \'}\n            <span>Better visits.</span>', '<span>Small details.</span>{\' \'}\n            <span>Your history.</span>')

          replace_count('src/marketing/MarketingProcess.jsx', 'Strain - Dose - Method - Mood.', 'Product - Amount - Method - Mood.')
          replace_count('src/marketing/MarketingProcess.jsx', 'Strain - Dose - Method - Mood', 'Product - Amount - Method - Mood')

          replace_count(
              'src/lib/privacyClaims.test.js',
              "  'It is a hard rule built into how the app works, not a policy we can quietly change later.',\n]",
              "  'It is a hard rule built into how the app works, not a policy we can quietly change later.',\n  'Stop guessing at the dispensary.',\n  'Start your research',\n  'Small habits.',\n  'Better visits.',\n  'Strain - Dose - Method - Mood',\n]",
          )
          replace_count(
              'src/lib/privacyClaims.test.js',
              "  assert.equal(about.includes('This is an engineering principle.'), true)\n})",
              "  assert.equal(about.includes('This is an engineering principle.'), true)\n  assert.equal(hero.includes('Remember what you tried.'), true)\n  assert.equal(hero.includes('Open My420Journal'), true)\n  assert.equal(features.includes('Small details.'), true)\n  assert.equal(features.includes('Your history.'), true)\n  assert.equal(process.includes('Product - Amount - Method - Mood'), true)\n})",
          )
          PY

      - name: Verify exact correction scope
        shell: bash
        run: |
          git diff --check
          changed="$(git status --porcelain | cut -c4- | sort)"
          expected="$(printf '%s\n' src/lib/privacyClaims.test.js src/marketing/MarketingFeatures.jsx src/marketing/MarketingHero.jsx src/marketing/MarketingProcess.jsx | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Guard retired global-home copy
        shell: bash
        run: |
          ! grep -R --exclude='privacyClaims.test.js' -F 'Stop guessing at the dispensary.' src README.md
          ! grep -R --exclude='privacyClaims.test.js' -F 'Start your research' src README.md
          ! grep -R --exclude='privacyClaims.test.js' -F 'Better visits.' src README.md
          ! grep -R --exclude='privacyClaims.test.js' -F 'Strain - Dose - Method - Mood' src README.md

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit validated global-home copy and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/privacyClaims.test.js src/marketing/MarketingFeatures.jsx src/marketing/MarketingHero.jsx src/marketing/MarketingProcess.jsx
          git rm .github/workflows/global-home-universalization.yml
          git commit -m 'Make global homepage product-first'
          git push origin HEAD:marketing/global-home-universal-v1
