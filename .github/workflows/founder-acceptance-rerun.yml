name: Temporary Founder Acceptance Browser Rerun

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: write
  checks: read

jobs:
  acceptance:
    if: github.event.head_commit.message == 'Rerun founder acceptance browser test'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_BASE: https://feature-phase1-log-talk-play.my420journal-app.pages.dev
      BRANCH_NAME: feature/phase1-log-talk-play-integration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase1-log-talk-play-integration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Rotate to CI-only preview tester code
        shell: bash
        run: |
          set -euo pipefail
          original_hash=$(python - <<'PY'
          from pathlib import Path
          import re
          text = Path('server/phase1-preview-access.js').read_text()
          m = re.search(r"PHASE1_PREVIEW_ACCESS_CODE_SHA256 = '([0-9a-f]{64})'", text)
          if not m: raise SystemExit('Preview access hash not found')
          print(m.group(1))
          PY
          )
          echo "ORIGINAL_HASH=$original_hash" >> "$GITHUB_ENV"
          raw=$(openssl rand -hex 18 | tr '[:lower:]' '[:upper:]')
          code="FAT-${raw:0:6}-${raw:6:6}-${raw:12:6}-${raw:18:6}-${raw:24:6}-${raw:30:6}"
          echo "::add-mask::$code"
          temp_hash=$(printf '%s' "$code" | sha256sum | awk '{print $1}')
          echo "TEMP_TEST_CODE=$code" >> "$GITHUB_ENV"
          python - "$temp_hash" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path('server/phase1-preview-access.js')
          text=p.read_text()
          text,count=re.subn(r"(PHASE1_PREVIEW_ACCESS_CODE_SHA256 = ')[0-9a-f]{64}(')",rf"\g<1>{sys.argv[1]}\g<2>",text,count=1)
          if count != 1: raise SystemExit('Expected one preview hash')
          p.write_text(text)
          PY
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add server/phase1-preview-access.js
          git commit -m 'Temporary founder acceptance browser hash'
          git push origin "HEAD:$BRANCH_NAME"
          echo "TEST_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for test deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            json=$(curl -sS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TEST_COMMIT/check-runs?per_page=100")
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success")' >/dev/null; then echo 'TEST_PREVIEW_DEPLOYED=PASS'; exit 0; fi
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion!="success")' >/dev/null; then exit 1; fi
            sleep 3
          done
          exit 1

      - name: Run live founder acceptance
        shell: bash
        run: |
          mkdir -p founder-acceptance
          cat > founder-acceptance-run.mjs <<'NODE'
          import { chromium } from 'playwright'
          import fs from 'node:fs'

          const base = process.env.PREVIEW_BASE
          const code = process.env.TEMP_TEST_CODE
          const report = { preview: base, startedAt: new Date().toISOString(), results: [], observations: {}, consoleErrors: [], pageErrors: [] }
          const record = (area, test, status, detail='') => {
            report.results.push({area,test,status,detail})
            console.log(`[${status}] ${area}: ${test}${detail ? ` -- ${detail}` : ''}`)
          }
          const text = async p => (await p.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim()
          const clip = (s,n=800) => String(s||'').replace(/\s+/g,' ').trim().slice(0,n)
          const shot = async (p,n) => p.screenshot({path:`founder-acceptance/${n}.png`,fullPage:true}).catch(()=>{})

          const browser = await chromium.launch({headless:true})
          const context = await browser.newContext({viewport:{width:1280,height:900}})
          const page = await context.newPage()
          page.on('console',m=>{ if(m.type()==='error') report.consoleErrors.push({url:page.url(),text:m.text()}) })
          page.on('pageerror',e=>report.pageErrors.push({url:page.url(),text:e.message}))

          // ACCESS
          try {
            let r=await page.goto(base,{waitUntil:'networkidle',timeout:60000})
            record('ACCESS','unauthenticated preview blocked',r?.status()===401?'PASS':'BLOCKER',`status=${r?.status()}`)
            record('ACCESS','private gate visible',(await page.getByText('Private Testing',{exact:true}).count())?'PASS':'BLOCKER')
            await page.getByLabel('Access code').fill(code)
            await page.getByRole('button',{name:'Continue'}).click()
            await page.waitForURL(`${base}/`,{timeout:15000})
            record('ACCESS','valid tester code opens preview',(await page.getByText('Private Testing',{exact:true}).count())===0?'PASS':'BLOCKER')
          } catch(e) { record('ACCESS','live gate flow','HARNESS-OR-PRODUCT-FAIL',e.message); await shot(page,'00-access-failure') }

          // ONBOARDING + LOG
          let accountReady=false
          try {
            await page.goto(`${base}/signup?m420test=1`,{waitUntil:'networkidle'})
            const email=await page.getByLabel('Email address').inputValue()
            record('ONBOARDING','test signup loads',email==='test@my420journal.local'?'PASS':'FAIL',`email=${email}`)
            await page.getByRole('button',{name:'Create your account'}).click()
            await page.waitForURL(/\/onboarding/,{timeout:15000})
            await page.getByRole('button',{name:'Meet them'}).click()
            await page.getByRole('button',{name:/Sunny Day/}).first().click()
            record('ONBOARDING','Sunny Day detail opens',(await text(page)).includes('Sunny Day')?'PASS':'FAIL')
            await page.getByRole('button',{name:'Choose Sunny as my guide'}).click()
            await page.waitForURL(/step=location/,{timeout:10000})
            await page.getByRole('button',{name:'Skip for now'}).click()
            await page.waitForURL(/\/pin-setup/,{timeout:10000})
            await page.getByRole('button',{name:'Skip for now'}).click()
            await page.waitForURL(/\/home/,{timeout:10000})
            accountReady=true
            record('ONBOARDING','local account + guide selection completes','PASS')
            await shot(page,'01-home')
          } catch(e) { record('ONBOARDING','real onboarding flow','HARNESS-OR-PRODUCT-FAIL',e.message); await shot(page,'01-onboarding-failure') }

          if(accountReady){
            try {
              await page.goto(`${base}/quick`,{waitUntil:'networkidle'})
              await page.getByPlaceholder('Product name...').fill('Founder Test Flower')
              await page.getByPlaceholder('Or type a note...').fill('Founder acceptance log. Calm and creative evening.')
              await shot(page,'02-quick-entry')
              await page.getByRole('button',{name:'Save',exact:true}).click()
              await page.waitForURL(/\/home/,{timeout:10000})
              record('LOG','Quick Entry saves','PASS')
              await page.goto(`${base}/journal`,{waitUntil:'networkidle'})
              let jt=await text(page)
              record('LOG','saved product appears in Journal',jt.includes('Founder Test Flower')?'PASS':'BLOCKER',clip(jt,500))
              await page.reload({waitUntil:'networkidle'})
              jt=await text(page)
              record('LOG','saved product survives reload',jt.includes('Founder Test Flower')?'PASS':'BLOCKER')
              report.observations.journal=clip(jt,1200)
              await shot(page,'03-journal')
            } catch(e) { record('LOG','live log/save/reload flow','HARNESS-OR-PRODUCT-FAIL',e.message); await shot(page,'03-log-failure') }

            try {
              await page.goto(`${base}/guide`,{waitUntil:'networkidle'})
              await page.waitForTimeout(600)
              let gt=await text(page)
              record('TALK','selected guide is Sunny Day',gt.includes('Sunny Day')?'PASS':'FAIL',clip(gt,400))
              const input=page.getByPlaceholder('Say something...')
              await input.fill('What product did I just log?')
              await input.press('Enter')
              await page.waitForTimeout(900)
              gt=await text(page)
              const knows=gt.includes('Founder Test Flower')
              record('TALK','guide answers from saved journal context',knows?'PASS':'BLOCKER',clip(gt,900))
              report.observations.guide=clip(gt,1600)
              await shot(page,'04-guide')
            } catch(e) { record('TALK','live guide conversation','HARNESS-OR-PRODUCT-FAIL',e.message); await shot(page,'04-talk-failure') }
          } else {
            record('LOG','live LOG acceptance','NOT-TESTED','onboarding did not complete')
            record('TALK','live TALK acceptance','NOT-TESTED','onboarding did not complete')
          }

          // WEED GOBLINS
          try {
            await page.goto(`${base}/games/weed-goblins`,{waitUntil:'networkidle'})
            await page.waitForTimeout(700)
            let wg=await text(page)
            record('PLAY-WG','Weed Goblins opens as Eliza conversation',wg.includes('Eliza')?'PASS':'BLOCKER',clip(wg,500))
            await shot(page,'05-wg-start')
            let interactions=0, rolls=0, replies=0, help=false, resume=false, completed=false
            for(let turn=0; turn<60; turn++){
              await page.waitForTimeout(180)
              if(await page.getByRole('button',{name:'Start another run'}).count()){completed=true;break}
              const name=page.getByLabel('Message Eliza a name')
              if(await name.count() && await name.isEnabled()){await name.fill('Moss');await name.press('Enter');interactions++;await page.waitForTimeout(350);continue}
              const look=page.getByLabel('Describe yourself to Eliza')
              if(await look.count() && await look.isEnabled()){await look.fill('a short traveler with a red scarf and muddy boots');await look.press('Enter');interactions++;await page.waitForTimeout(350);continue}
              const roll=page.getByRole('button',{name:'Roll D20'})
              if(await roll.count() && await roll.isEnabled()){await roll.click();rolls++;interactions++;await page.waitForTimeout(500);continue}
              if(!help && interactions>=4){const h=page.getByRole('button',{name:/^Help/});if(await h.count()&&await h.isEnabled()){const b=(await text(page)).length;await h.click();await page.waitForTimeout(250);help=(await text(page)).length>b;record('PLAY-WG','Help adds guidance',help?'PASS':'FAIL');continue}}
              const qs=page.locator('.weed-goblins-game__quick-reply:enabled')
              if(await qs.count()){await qs.first().click();replies++;interactions++;await page.waitForTimeout(450)}
              else {const custom=page.getByLabel('Message Eliza another action');if(await custom.count()&&await custom.isEnabled()){await custom.fill('I look around carefully');await custom.press('Enter');interactions++;await page.waitForTimeout(450)}else{await page.waitForTimeout(500)}}
              if(!resume && interactions>=6){const keys=await page.evaluate(()=>Object.keys(localStorage).filter(k=>k.includes('weed_goblins')));await page.reload({waitUntil:'networkidle'});await page.waitForTimeout(500);const reset=(await page.getByLabel('Message Eliza a name').count())>0;resume=keys.length>0&&!reset;record('PLAY-WG','active run resumes after reload',resume?'PASS':'BLOCKER',`keys=${keys.join(',')}; resetToName=${reset}`)}
            }
            record('PLAY-WG','explicit D20 lifecycle exercised',rolls>0?'PASS':'BLOCKER',`rolls=${rolls}`)
            record('PLAY-WG','quick-reply interaction exercised',replies>0?'PASS':'BLOCKER',`quickReplies=${replies}`)
            record('PLAY-WG','founder playthrough reaches an ending',completed?'PASS':'BLOCKER',`interactions=${interactions}; rolls=${rolls}`)
            report.observations.weedGoblins={interactions,rolls,replies,help,resume,completed,finalText:clip(await text(page),1600)}
            await shot(page,'06-wg-final')
          } catch(e) { record('PLAY-WG','live Weed Goblins playthrough','HARNESS-OR-PRODUCT-FAIL',e.message); await shot(page,'06-wg-failure') }

          // GAME 2 + GAME 3 routing
          for(const [area,path,title] of [['PLAY-WTML','/games/who-took-my-lighter','Who Took My Lighter?'],['PLAY-TNP','/games/the-new-place','The New Place']]){
            try{
              const r=await page.goto(`${base}${path}`,{waitUntil:'networkidle'})
              await page.waitForTimeout(300)
              const finalUrl=page.url(), bt=await text(page)
              const mounted=new URL(finalUrl).pathname===path && bt.includes(title)
              record(area,`${title} is reachable and mounted`,mounted?'PASS':'BLOCKER',`http=${r?.status()}; finalUrl=${finalUrl}; titleVisible=${bt.includes(title)}`)
              report.observations[area]={http:r?.status(),finalUrl,body:clip(bt,900)}
              await shot(page,area==='PLAY-WTML'?'07-wtml':'08-tnp')
            }catch(e){record(area,`${title} live route`,'HARNESS-OR-PRODUCT-FAIL',e.message)}
          }

          report.finishedAt=new Date().toISOString()
          fs.writeFileSync('founder-acceptance/acceptance-report.json',JSON.stringify(report,null,2))
          console.log('ACCEPTANCE_REPORT_JSON='+JSON.stringify(report))
          await context.close(); await browser.close()
          NODE
          node ./founder-acceptance-run.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-acceptance-evidence-rerun
          path: founder-acceptance/
          retention-days: 7

      - name: Restore founder access and remove test workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"
          test -n "${ORIGINAL_HASH:-}"
          python - "$ORIGINAL_HASH" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('server/phase1-preview-access.js'); text=p.read_text()
          text,count=re.subn(r"(PHASE1_PREVIEW_ACCESS_CODE_SHA256 = ')[0-9a-f]{64}(')",rf"\g<1>{sys.argv[1]}\g<2>",text,count=1)
          if count != 1: raise SystemExit('Expected one preview hash')
          p.write_text(text)
          PY
          git rm -f .github/workflows/founder-acceptance-rerun.yml
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add server/phase1-preview-access.js
          git commit -m 'Restore founder access after acceptance rerun'
          git push origin "HEAD:$BRANCH_NAME"
          echo "RESTORE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify restored preview deployment
        if: always() && env.RESTORE_COMMIT != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            json=$(curl -sS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$RESTORE_COMMIT/check-runs?per_page=100")
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success")' >/dev/null; then echo 'FOUNDER_PREVIEW_RESTORED=PASS'; exit 0; fi
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion!="success")' >/dev/null; then exit 1; fi
            sleep 3
          done
          exit 1
