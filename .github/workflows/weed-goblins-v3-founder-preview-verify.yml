name: Weed Goblins V3 Founder Preview Verify

on:
  push:
    branches:
      - feature/weed-goblins-v3-starter-lands

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run V3 Starter Lands tests with diagnostics
        id: v3
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --test src/features/games/weed-goblins/v3/*.test.js 2>&1 | tee v3.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload V3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weed-goblins-v3-test-log
          path: v3.log
          retention-days: 1
      - name: Run existing regression suite with diagnostics
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee regression.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weed-goblins-v3-regression-log
          path: regression.log
          retention-days: 1
      - name: Build production bundle
        id: build
        continue-on-error: true
        run: npm run build
      - name: Fail if verification failed
        if: steps.v3.outcome == 'failure' || steps.regression.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
