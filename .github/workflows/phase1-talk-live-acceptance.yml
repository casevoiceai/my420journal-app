name: Temporary Phase 1 TALK Live Acceptance

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: write
  checks: read

jobs:
  acceptance:
    if: github.event.head_commit.message == 'Run TALK acceptance browser'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_BASE: https://feature-phase1-log-talk-play.my420journal-app.pages.dev
      BRANCH_NAME: feature/phase1-log-talk-play-integration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase1-log-talk-play-integration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Chromium test dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Rotate to masked CI-only preview tester code
        shell: bash
        run: |
          set -euo pipefail
          original_hash=$(python - <<'PY'
          from pathlib import Path
          import re
          text=Path('server/phase1-preview-access.js').read_text()
          m=re.search(r"PHASE1_PREVIEW_ACCESS_CODE_SHA256 = '([0-9a-f]{64})'",text)
          if not m: raise SystemExit('Preview access hash not found')
          print(m.group(1))
          PY
          )
          echo "ORIGINAL_HASH=$original_hash" >> "$GITHUB_ENV"
          raw=$(openssl rand -hex 18 | tr '[:lower:]' '[:upper:]')
          code="TALK-${raw:0:6}-${raw:6:6}-${raw:12:6}-${raw:18:6}-${raw:24:6}-${raw:30:6}"
          echo "::add-mask::$code"
          temp_hash=$(printf '%s' "$code" | sha256sum | awk '{print $1}')
          echo "TEMP_TEST_CODE=$code" >> "$GITHUB_ENV"
          python - "$temp_hash" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('server/phase1-preview-access.js')
          text=p.read_text()
          text,count=re.subn(r"(PHASE1_PREVIEW_ACCESS_CODE_SHA256 = ')[0-9a-f]{64}(')",rf"\g<1>{sys.argv[1]}\g<2>",text,count=1)
          if count != 1: raise SystemExit('Expected one preview hash')
          p.write_text(text)
          PY
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add server/phase1-preview-access.js
          git commit -m 'Temporary TALK acceptance hash'
          git push origin "HEAD:$BRANCH_NAME"
          echo "TEST_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for exact test deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            json=$(curl -sS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TEST_COMMIT/check-runs?per_page=100")
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success")' >/dev/null; then
              echo 'TALK_TEST_PREVIEW_DEPLOYED=PASS'
              exit 0
            fi
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion!="success")' >/dev/null; then exit 1; fi
            sleep 3
          done
          exit 1

      - name: Run live LOG to TALK acceptance
        shell: bash
        run: |
          mkdir -p talk-acceptance
          cat > talk-acceptance-run.mjs <<'NODE'
          import { chromium } from 'playwright'
          import fs from 'node:fs'

          const base=process.env.PREVIEW_BASE
          const code=process.env.TEMP_TEST_CODE
          const product='Founder TALK Acceptance Flower'
          const report={preview:base,startedAt:new Date().toISOString(),results:[],guideNetworkRequests:[],consoleErrors:[],pageErrors:[]}
          const record=(test,status,detail='')=>{report.results.push({test,status,detail});console.log(`[${status}] ${test}${detail?` -- ${detail}`:''}`)}
          const bodyText=async p=>(await p.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim()
          const clip=(s,n=1000)=>String(s||'').replace(/\s+/g,' ').trim().slice(0,n)
          const browser=await chromium.launch({headless:true})
          const context=await browser.newContext({viewport:{width:1280,height:900}})
          const page=await context.newPage()
          page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push({url:page.url(),text:m.text()})})
          page.on('pageerror',e=>report.pageErrors.push({url:page.url(),text:e.message}))

          try {
            let r=await page.goto(base,{waitUntil:'networkidle',timeout:60000})
            record('private preview rejects unauthenticated access',r?.status()===401?'PASS':'BLOCKER',`status=${r?.status()}`)
            await page.getByLabel('Access code').fill(code)
            await page.getByRole('button',{name:'Continue'}).click()
            await page.waitForURL(`${base}/`,{timeout:15000})
            record('masked tester code opens preview','PASS')

            await page.goto(`${base}/signup?m420test=1`,{waitUntil:'networkidle'})
            await page.getByRole('button',{name:'Create your account'}).click()
            await page.waitForURL(/\/onboarding/,{timeout:15000})
            await page.getByRole('button',{name:'Meet them'}).click()
            await page.getByRole('button',{name:/Sunny Day/}).first().click()
            await page.getByRole('button',{name:'Choose Sunny as my guide'}).click()
            await page.waitForURL(/step=location/,{timeout:10000})
            await page.getByRole('button',{name:'Skip for now'}).click()
            await page.waitForURL(/\/pin-setup/,{timeout:10000})
            await page.getByRole('button',{name:'Skip for now'}).click()
            await page.waitForURL(/\/home/,{timeout:10000})
            record('fresh local profile with Sunny completes','PASS')

            await page.goto(`${base}/quick`,{waitUntil:'networkidle'})
            await page.getByPlaceholder('Product name...').fill(product)
            await page.getByRole('button',{name:'Save',exact:true}).click()
            await page.waitForURL(/\/home/,{timeout:10000})
            await page.goto(`${base}/journal`,{waitUntil:'networkidle'})
            let journal=await bodyText(page)
            record('LOG saves product locally',journal.includes(product)?'PASS':'BLOCKER',clip(journal,500))
            await page.reload({waitUntil:'networkidle'})
            journal=await bodyText(page)
            record('LOG survives reload',journal.includes(product)?'PASS':'BLOCKER')

            await page.goto(`${base}/guide`,{waitUntil:'networkidle'})
            await page.waitForTimeout(500)
            const input=page.getByPlaceholder('Say something...')
            let capture=false
            page.on('request',request=>{
              if(capture){
                const url=request.url()
                if(url.includes('/api/')||/anthropic|openai|claude/i.test(url)) report.guideNetworkRequests.push(url)
              }
            })
            capture=true
            await input.fill('What product did I just log?')
            await input.press('Enter')
            await page.waitForTimeout(700)
            let guide=await bodyText(page)
            record('TALK recalls exact latest local product',guide.includes(`You just logged ${product}.`)?'PASS':'BLOCKER',clip(guide,1000))
            record('TALK recall makes no API or external AI request',report.guideNetworkRequests.length===0?'PASS':'BLOCKER',report.guideNetworkRequests.join(', '))

            await page.reload({waitUntil:'networkidle'})
            await page.waitForTimeout(400)
            const input2=page.getByPlaceholder('Say something...')
            await input2.fill('What products have I logged?')
            await input2.press('Enter')
            await page.waitForTimeout(600)
            guide=await bodyText(page)
            record('TALK still recalls journal after Guide reload',guide.includes(product)?'PASS':'BLOCKER',clip(guide,1000))

            await input2.fill('What should I use next?')
            await input2.press('Enter')
            await page.waitForTimeout(500)
            guide=await bodyText(page)
            record('TALK refuses product recommendation',guide.includes("don't recommend products")?'PASS':'BLOCKER',clip(guide,1000))

            await input2.fill('Can you diagnose what this means?')
            await input2.press('Enter')
            await page.waitForTimeout(500)
            guide=await bodyText(page)
            record('TALK refuses medical interpretation',guide.includes("can't diagnose, treat, prescribe")?'PASS':'BLOCKER',clip(guide,1000))
            await page.screenshot({path:'talk-acceptance/talk-final.png',fullPage:true})
          } catch(error) {
            record('live TALK acceptance flow','HARNESS-OR-PRODUCT-FAIL',error.message)
            await page.screenshot({path:'talk-acceptance/failure.png',fullPage:true}).catch(()=>{})
          }

          report.finishedAt=new Date().toISOString()
          fs.writeFileSync('talk-acceptance/talk-report.json',JSON.stringify(report,null,2))
          console.log('TALK_REPORT_JSON='+JSON.stringify(report))
          await context.close();await browser.close()
          NODE
          node ./talk-acceptance-run.mjs

      - name: Upload TALK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-talk-live-acceptance
          path: talk-acceptance/
          retention-days: 7

      - name: Restore founder access and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"
          test -n "${ORIGINAL_HASH:-}"
          python - "$ORIGINAL_HASH" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('server/phase1-preview-access.js')
          text=p.read_text()
          text,count=re.subn(r"(PHASE1_PREVIEW_ACCESS_CODE_SHA256 = ')[0-9a-f]{64}(')",rf"\g<1>{sys.argv[1]}\g<2>",text,count=1)
          if count != 1: raise SystemExit('Expected one preview hash')
          p.write_text(text)
          PY
          git rm -f .github/workflows/phase1-talk-live-acceptance.yml
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add server/phase1-preview-access.js
          git commit -m 'Restore founder access after TALK acceptance'
          git push origin "HEAD:$BRANCH_NAME"
          echo "RESTORE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify restored founder preview deployment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${RESTORE_COMMIT:-}"
          for attempt in $(seq 1 100); do
            json=$(curl -sS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$RESTORE_COMMIT/check-runs?per_page=100")
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success")' >/dev/null; then
              echo 'FOUNDER_PREVIEW_RESTORED=PASS'
              exit 0
            fi
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion!="success")' >/dev/null; then exit 1; fi
            sleep 3
          done
          exit 1
