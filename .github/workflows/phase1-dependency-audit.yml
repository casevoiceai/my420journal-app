name: Temporary Phase 1 Dependency Audit

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Run Phase 1 dependency security audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Capture complete audit
        shell: bash
        run: |
          mkdir -p dependency-audit
          npm audit --json > dependency-audit/npm-audit-all.json || true
          npm audit --omit=dev --json > dependency-audit/npm-audit-production.json || true
          npm ls --all --json > dependency-audit/npm-ls.json || true
          node - <<'NODE'
          const fs=require('fs')
          for (const name of ['npm-audit-all.json','npm-audit-production.json']) {
            const p='dependency-audit/'+name
            const d=JSON.parse(fs.readFileSync(p,'utf8'))
            const summary={metadata:d.metadata,vulnerabilities:Object.fromEntries(Object.entries(d.vulnerabilities||{}).map(([k,v])=>[k,{name:v.name,severity:v.severity,isDirect:v.isDirect,via:v.via,effects:v.effects,range:v.range,nodes:v.nodes,fixAvailable:v.fixAvailable}]))}
            fs.writeFileSync('dependency-audit/summary-'+name,JSON.stringify(summary,null,2))
          }
          NODE
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-dependency-audit
          path: dependency-audit/
          retention-days: 7
