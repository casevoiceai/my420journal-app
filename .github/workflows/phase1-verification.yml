name: Phase 1 Verification

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration
      - feature/weed-goblins-rpg-vertical-slice
  workflow_dispatch:

# Branch-local verification entry is temporary and will be removed after the slice passes.
permissions:
  contents: read

jobs:
  verify:
    name: Full test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test

      - name: Run production build
        run: npm run build
