name: Temporary Founder Acceptance Game Depth

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: write
  checks: read

jobs:
  depth:
    if: github.event.head_commit.message == 'Run focused founder acceptance game completions'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_BASE: https://feature-phase1-log-talk-play.my420journal-app.pages.dev
      BRANCH_NAME: feature/phase1-log-talk-play-integration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase1-log-talk-play-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Rotate to CI-only preview tester code
        shell: bash
        run: |
          set -euo pipefail
          original_hash=$(python - <<'PY'
          from pathlib import Path
          import re
          text=Path('server/phase1-preview-access.js').read_text()
          m=re.search(r"PHASE1_PREVIEW_ACCESS_CODE_SHA256 = '([0-9a-f]{64})'",text)
          if not m: raise SystemExit('Preview access hash not found')
          print(m.group(1))
          PY
          )
          echo "ORIGINAL_HASH=$original_hash" >> "$GITHUB_ENV"
          raw=$(openssl rand -hex 18 | tr '[:lower:]' '[:upper:]')
          code="FATD-${raw:0:6}-${raw:6:6}-${raw:12:6}-${raw:18:6}-${raw:24:6}-${raw:30:6}"
          echo "::add-mask::$code"
          hash=$(printf '%s' "$code" | sha256sum | awk '{print $1}')
          echo "TEMP_TEST_CODE=$code" >> "$GITHUB_ENV"
          python - "$hash" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('server/phase1-preview-access.js'); text=p.read_text()
          text,count=re.subn(r"(PHASE1_PREVIEW_ACCESS_CODE_SHA256 = ')[0-9a-f]{64}(')",rf"\g<1>{sys.argv[1]}\g<2>",text,count=1)
          if count != 1: raise SystemExit('Expected one preview hash')
          p.write_text(text)
          PY
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add server/phase1-preview-access.js
          git commit -m 'Temporary focused acceptance tester hash'
          git push origin "HEAD:$BRANCH_NAME"
          echo "TEST_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Wait for focused test deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            json=$(curl -sS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TEST_COMMIT/check-runs?per_page=100")
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success")' >/dev/null; then echo 'FOCUSED_TEST_DEPLOYED=PASS'; exit 0; fi
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion!="success")' >/dev/null; then exit 1; fi
            sleep 3
          done
          exit 1
      - name: Run focused live completions
        shell: bash
        run: |
          mkdir -p founder-acceptance-depth
          cat > founder-acceptance-depth.mjs <<'NODE'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          const base=process.env.PREVIEW_BASE, code=process.env.TEMP_TEST_CODE
          const report={startedAt:new Date().toISOString(),results:[],observations:{}}
          const rec=(area,test,status,detail='')=>{report.results.push({area,test,status,detail});console.log(`[${status}] ${area}: ${test}${detail?` -- ${detail}`:''}`)}
          const body=async p=>(await p.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim()
          const shot=(p,n)=>p.screenshot({path:`founder-acceptance-depth/${n}.png`,fullPage:true}).catch(()=>{})
          const browser=await chromium.launch({headless:true}); const ctx=await browser.newContext({viewport:{width:1280,height:900}}); const page=await ctx.newPage()
          try{
            let r=await page.goto(base,{waitUntil:'networkidle',timeout:60000}); if(r?.status()!==401) throw new Error(`gate status ${r?.status()}`)
            await page.getByLabel('Access code').fill(code); await page.getByRole('button',{name:'Continue'}).click(); await page.waitForURL(`${base}/`)
            rec('ACCESS','focused tester authenticated','PASS')
            await page.goto(`${base}/signup?m420test=1`,{waitUntil:'networkidle'}); await page.getByRole('button',{name:'Create your account'}).click(); await page.waitForURL(/\/onboarding/)
            await page.getByRole('button',{name:'Meet them'}).click(); await page.getByRole('button',{name:/Sunny Day/}).first().click(); await page.getByRole('button',{name:'Choose Sunny as my guide'}).click(); await page.waitForURL(/step=location/); await page.getByRole('button',{name:'Skip for now'}).click(); await page.waitForURL(/\/pin-setup/); await page.getByRole('button',{name:'Skip for now'}).click(); await page.waitForURL(/\/home/)
            rec('SETUP','fresh local acceptance profile ready','PASS')

            // Weed Goblins targeted path.
            await page.goto(`${base}/games/weed-goblins`,{waitUntil:'networkidle'}); await page.waitForTimeout(500)
            const name=page.getByLabel('Message Eliza a name'); await name.fill('Moss'); await name.press('Enter')
            for(let i=0;i<4;i++){const q=page.locator('.weed-goblins-game__quick-reply:enabled'); await q.first().click(); await page.waitForTimeout(220)}
            const look=page.getByLabel('Describe yourself to Eliza'); if(await look.count()){await look.fill('a short traveler with a red scarf and muddy boots'); await look.press('Enter')} else {const q=page.locator('.weed-goblins-game__quick-reply:enabled');await q.first().click()}
            await page.waitForTimeout(400)
            await page.getByRole('button',{name:'Head for Rattlebridge'}).click(); await page.waitForTimeout(250)
            await page.getByRole('button',{name:'Cut the line and cross quietly'}).click(); await page.waitForTimeout(300)
            const roll1=page.getByRole('button',{name:'Roll D20'}); const staged=await roll1.count()>0
            rec('PLAY-WG','Rattlebridge explicitly stages Roll D20',staged?'PASS':'BLOCKER',`rollVisible=${staged}`)
            if(staged){await roll1.click(); await page.waitForTimeout(500)}
            await page.getByRole('button',{name:/cloak hem is black with bridge tar/i}).click(); await page.waitForTimeout(250)
            await page.getByRole('button',{name:'Tell it the fee was already paid'}).click(); await page.waitForTimeout(250)
            const roll2=page.getByRole('button',{name:'Roll D20'}); if(await roll2.count()) {await roll2.click();await page.waitForTimeout(500)}
            await page.getByRole('button',{name:'Leave for Highland Camp'}).click(); await page.waitForTimeout(250)
            await page.getByRole('button',{name:'Burnt cloudberry syrup'}).click(); await page.waitForTimeout(250)
            await page.getByRole('button',{name:'Study the picture ledger'}).click(); await page.waitForTimeout(250)
            const beforeReload=await body(page); await page.reload({waitUntil:'networkidle'}); await page.waitForTimeout(400); const afterReload=await body(page)
            rec('PLAY-WG','targeted mid-run survives reload',afterReload.includes('picture ledger')||afterReload.includes('King')?'PASS':'BLOCKER',`before=${beforeReload.slice(-350)} after=${afterReload.slice(-350)}`)
            await page.getByRole('button',{name:'Leave the ledger alone'}).click(); await page.waitForTimeout(250)
            await page.getByRole('button',{name:/Head for the King's Stash Hall/}).click(); await page.waitForTimeout(250)
            await page.getByRole('button',{name:'Force the latch'}).click(); await page.waitForTimeout(250)
            const roll3=page.getByRole('button',{name:'Roll D20'}); if(await roll3.count()){await roll3.click();await page.waitForTimeout(500)}
            const evidence=page.getByRole('button',{name:'Put the tribute evidence in front of him'}); if(await evidence.count()) {await evidence.click(); await page.waitForTimeout(600)}
            const wgText=await body(page); const wgDone=(await page.getByRole('button',{name:'Start another run'}).count())>0 || /recovered|bargain|ending/i.test(wgText.slice(-1200))
            rec('PLAY-WG','targeted Chapter 1 path reaches completed ending',wgDone?'PASS':'BLOCKER',wgText.slice(-900))
            report.observations.weedGoblins=wgText.slice(-1800); await shot(page,'01-wg-complete')

            // Who Took My Lighter? complete case with persistence.
            await page.goto(`${base}/games/who-took-my-lighter`,{waitUntil:'networkidle'}); await page.waitForTimeout(350)
            await page.getByRole('button',{name:'Examine the scene'}).click(); await page.waitForTimeout(150)
            await page.getByRole('button',{name:/^Inspect:/}).first().click(); await page.waitForTimeout(150)
            await page.getByRole('button',{name:'Start interviews'}).click(); await page.waitForTimeout(150)
            await page.getByRole('button',{name:/^Interview /}).first().click(); await page.waitForTimeout(150)
            const wtBefore=await body(page); await page.reload({waitUntil:'networkidle'}); await page.waitForTimeout(300); const wtAfter=await body(page)
            rec('PLAY-WTML','active mystery persists after reload',/1 of 4 interviewed/.test(wtAfter)?'PASS':'BLOCKER',wtAfter.slice(0,550))
            await page.getByRole('button',{name:/^Interview /}).first().click(); await page.waitForTimeout(150)
            await page.getByRole('button',{name:/^Inspect:/}).first().click(); await page.waitForTimeout(150)
            const accuse=page.getByRole('button',{name:/^Accuse /}).first(); const accusationUnlocked=await accuse.count()>0
            rec('PLAY-WTML','investigation unlocks accusation',accusationUnlocked?'PASS':'BLOCKER')
            if(accusationUnlocked){await accuse.click();await page.waitForTimeout(350)}
            const wtText=await body(page); const wtDone=/Case solved\.|Case closed\./.test(wtText) && (await page.getByRole('button',{name:'Start a new case'}).count())>0
            rec('PLAY-WTML','case reaches coherent completed reveal',wtDone?'PASS':'BLOCKER',wtText.slice(-850)); report.observations.wtml=wtText.slice(-1600); await shot(page,'02-wtml-complete')

            // The New Place complete seven-day week with midweek reload.
            await page.goto(`${base}/games/the-new-place`,{waitUntil:'networkidle'}); await page.waitForTimeout(350)
            let actions=0, reloadPass=false
            for(let i=0;i<16;i++){
              const newWeek=page.getByRole('button',{name:'Start a new week'}); if(await newWeek.count()) break
              const section=page.getByRole('region',{name:'Available decisions'}); const buttons=section.getByRole('button'); if(!(await buttons.count())) break
              await buttons.first().click(); actions++; await page.waitForTimeout(170)
              if(actions===6){const before=await body(page); await page.reload({waitUntil:'networkidle'}); await page.waitForTimeout(300); const after=await body(page); reloadPass=after.includes('Reports filed: 3 of 7')||after.includes('Reports filed: 2 of 7')||after.includes('Reports filed: 3'); rec('PLAY-TNP','midweek state persists after reload',reloadPass?'PASS':'BLOCKER',after.slice(0,700))}
            }
            const tnpText=await body(page); const tnpDone=(await page.getByRole('button',{name:'Start a new week'}).count())>0 && /Sunday summary/i.test(tnpText)
            rec('PLAY-TNP','seven-day week reaches Sunday summary',tnpDone?'PASS':'BLOCKER',`actions=${actions}; ${tnpText.slice(-900)}`); report.observations.tnp=tnpText.slice(-1800); await shot(page,'03-tnp-complete')
          }catch(e){rec('DEPTH','focused browser path completed','HARNESS-OR-PRODUCT-FAIL',e.stack||e.message); await shot(page,'99-failure')}
          report.finishedAt=new Date().toISOString(); fs.writeFileSync('founder-acceptance-depth/depth-report.json',JSON.stringify(report,null,2)); console.log('DEPTH_REPORT_JSON='+JSON.stringify(report)); await ctx.close(); await browser.close()
          NODE
          node ./founder-acceptance-depth.mjs
      - name: Upload depth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-acceptance-depth-evidence
          path: founder-acceptance-depth/
          retention-days: 7
      - name: Restore founder access and remove depth workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"
          test -n "${ORIGINAL_HASH:-}"
          python - "$ORIGINAL_HASH" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('server/phase1-preview-access.js'); text=p.read_text()
          text,count=re.subn(r"(PHASE1_PREVIEW_ACCESS_CODE_SHA256 = ')[0-9a-f]{64}(')",rf"\g<1>{sys.argv[1]}\g<2>",text,count=1)
          if count != 1: raise SystemExit('Expected one preview hash')
          p.write_text(text)
          PY
          git rm -f .github/workflows/founder-acceptance-depth.yml
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add server/phase1-preview-access.js
          git commit -m 'Restore founder access after focused acceptance'
          git push origin "HEAD:$BRANCH_NAME"
          echo "RESTORE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify restored founder deployment
        if: always() && env.RESTORE_COMMIT != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            json=$(curl -sS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$RESTORE_COMMIT/check-runs?per_page=100")
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success")' >/dev/null; then echo 'FOUNDER_ACCESS_RESTORED=PASS'; exit 0; fi
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion!="success")' >/dev/null; then exit 1; fi
            sleep 3
          done
          exit 1
