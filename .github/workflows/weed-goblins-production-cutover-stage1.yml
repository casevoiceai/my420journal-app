name: Weed Goblins production cutover stage 1

on:
  push:
    branches:
      - remove-anthropic/weed-goblins-workers-ai

permissions:
  contents: write

jobs:
  deploy-guarded:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out approved feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 41; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING'; exit 42; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Re-run full test and build gate
        shell: bash
        run: |
          npm ci
          npm test
          npm run build
          git diff --check
          if git grep -niE 'anthropic|claude' -- server/weed-goblins-narration-worker; then
            echo 'Forbidden provider reference remains in Weed Goblins narration Worker.'
            exit 43
          fi

      - name: Deploy production narration Worker
        id: deploy
        working-directory: server/weed-goblins-narration-worker
        shell: bash
        run: |
          set -o pipefail
          npx wrangler@latest deploy 2>&1 | tee /tmp/weed-goblins-production-deploy.log
          grep -q 'env.AI' /tmp/weed-goblins-production-deploy.log || { echo 'AI_BINDING_NOT_CONFIRMED'; exit 44; }
          worker_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/weed-goblins-production-deploy.log | tail -1 | tr -d '\r')
          test -n "$worker_url" || { echo 'PRODUCTION_WORKER_URL_NOT_FOUND'; exit 45; }
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Production Worker URL resolved: $worker_url"

      - name: Verify production authorization wall
        shell: bash
        env:
          PROD_WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          status=$(curl --silent --show-error --max-time 60 \
            --output /tmp/weed-goblins-prod-unauthorized.json \
            --write-out '%{http_code}' \
            --request POST "$PROD_WORKER_URL" \
            --header 'Content-Type: application/json' \
            --data '{"moment":"natural-one-complication","outcome":"complication"}')
          test "$status" = '401' || { echo "PRODUCTION_AUTH_WALL_HTTP_$status"; cat /tmp/weed-goblins-prod-unauthorized.json; exit 51; }
          echo 'PRODUCTION_AUTH_WALL_OK'

      - name: Confirm Anthropic rollback credential is still retained
        working-directory: server/weed-goblins-narration-worker
        shell: bash
        run: |
          npx wrangler@latest secret list > /tmp/weed-goblins-production-secrets.json
          grep -q 'WEED_GOBLINS_ANTHROPIC_API_KEY' /tmp/weed-goblins-production-secrets.json || { echo 'ROLLBACK_ANTHROPIC_SECRET_MISSING'; exit 52; }
          grep -q 'WEED_GOBLINS_PROXY_SECRET' /tmp/weed-goblins-production-secrets.json || { echo 'PRODUCTION_PROXY_SECRET_MISSING'; exit 53; }
          grep -q 'WEED_GOBLINS_RATE_LIMIT_SALT' /tmp/weed-goblins-production-secrets.json || { echo 'PRODUCTION_RATE_LIMIT_SALT_MISSING'; exit 54; }
          echo 'Rollback credential and production security secrets remain present.'

      - name: Roll back production if post-deploy verification failed
        if: failure() && steps.deploy.outcome == 'success'
        working-directory: server/weed-goblins-narration-worker
        shell: bash
        run: |
          echo 'Post-deploy verification failed. Rolling back to previous Worker version.'
          npx wrangler@latest rollback --message 'Automated rollback after failed Weed Goblins Workers AI cutover verification'

      - name: Remove temporary deployment workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/weed-goblins-production-cutover-stage1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Weed Goblins production deployment workflow'
          git push origin HEAD:${GITHUB_REF_NAME}
