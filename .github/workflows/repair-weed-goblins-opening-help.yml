name: Repair Weed Goblins Opening and Help

on:
  push:
    branches:
      - feature/weed-goblins-session-zero

permissions:
  contents: write

jobs:
  repair-test-deploy-proof:
    if: github.event.head_commit.message == 'Run Weed Goblins opening/help repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYTEST_URL: https://weed-goblins-playtest.casevoice-ai.workers.dev/games/weed-goblins
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weed-goblins-session-zero
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply exact approved source repair
        run: python .github/repair-wg-opening-help.py

      - name: Verify source and unchanged Windcut block
        run: node .github/verify-wg-opening-source.mjs

      - name: Check diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run Chapter 1 static tests
        run: node --test src/features/games/weed-goblins/weedGoblinsChapterOneStatic.test.js

      - name: Build production bundle
        run: npm run build

      - name: Commit validated source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add src/features/games/weed-goblins/weedGoblinsChapterOne.js src/features/games/weed-goblins/weedGoblinsHelpChapterOne.js src/features/games/weed-goblins/WeedGoblinsChat.jsx
          git commit -m 'Restore approved Weed Goblins opening and opt-in Help'
          FIX_COMMIT="$(git rev-parse HEAD)"
          echo "FIX_COMMIT=$FIX_COMMIT" >> "$GITHUB_ENV"
          git push origin feature/weed-goblins-session-zero
          echo "VALIDATED_FIX_COMMIT=$FIX_COMMIT"

      - name: Deploy validated bundle to preview-only Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@latest pages deploy dist --project-name=my420journal-app --branch=feature/weed-goblins-session-zero --commit-hash="$FIX_COMMIT" --commit-message='Restore approved Weed Goblins opening and opt-in Help' --commit-dirty=false
          for attempt in $(seq 1 30); do
            response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/my420journal-app/deployments")"
            origin="$(printf '%s' "$response" | jq -r --arg sha "$FIX_COMMIT" '.result[] | select(.deployment_trigger.metadata.commit_hash == $sha and .environment == "preview") | .url' | head -n 1)"
            if [ -n "$origin" ] && [ "$origin" != "null" ]; then
              echo "PAGES_ORIGIN=$origin" >> "$GITHUB_ENV"
              echo "PREVIEW_DEPLOYMENT=$origin"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Upload private gateway Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"main_module":"worker.mjs","compatibility_date":"2026-08-10"}' > /tmp/metadata.json
          response="$(curl --fail-with-body --silent --show-error -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/weed-goblins-playtest" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -F 'metadata=@/tmp/metadata.json;type=application/json' -F 'worker.mjs=@.github/weed-goblins-private-gateway.mjs;type=application/javascript+module')"
          printf '%s' "$response" | jq -e '.success == true' >/dev/null

      - name: Set gateway origin and rotate private session secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          origin_payload="$(jq -nc --arg value "$PAGES_ORIGIN" '{name:"PAGES_ORIGIN",text:$value,type:"secret_text"}')"
          response="$(curl --fail-with-body --silent --show-error -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/weed-goblins-playtest/secrets" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "$origin_payload")"
          printf '%s' "$response" | jq -e '.success == true' >/dev/null
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "PLAYTEST_SESSION_SECRET=$secret" >> "$GITHUB_ENV"
          session_payload="$(jq -nc --arg value "$secret" '{name:"SESSION_SECRET",text:$value,type:"secret_text"}')"
          response="$(curl --fail-with-body --silent --show-error -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/weed-goblins-playtest/secrets" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "$session_payload")"
          printf '%s' "$response" | jq -e '.success == true' >/dev/null

      - name: Verify private gate and authenticated proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            gate="$(curl --silent --show-error --max-time 10 "$PLAYTEST_URL" || true)"
            app="$(curl --silent --show-error --max-time 10 -H "Cookie: wg_private_playtest=${PLAYTEST_SESSION_SECRET}" "$PLAYTEST_URL" || true)"
            if printf '%s' "$gate" | grep -q 'Private Weed Goblins Playtest' && printf '%s' "$app" | grep -q '<div id="root"></div>'; then
              echo 'PRIVATE_GATE_AND_AUTHENTICATED_PROXY=PASS'
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Install browser proof tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Screenshot and verify live opening
        run: |
          mkdir -p playtest-artifacts
          node .github/proof-wg-opening-live.mjs

      - name: Upload verified opening screenshot
        uses: actions/upload-artifact@v4
        with:
          name: weed-goblins-approved-opening-proof
          path: playtest-artifacts/weed-goblins-opening-approved.png
          if-no-files-found: error

      - name: Remove temporary repair tooling
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin feature/weed-goblins-session-zero
          rm .github/workflows/repair-weed-goblins-opening-help.yml .github/repair-wg-opening-help.py .github/verify-wg-opening-source.mjs .github/weed-goblins-private-gateway.mjs .github/proof-wg-opening-live.mjs
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add -A
          git commit -m 'Remove temporary Weed Goblins repair tooling'
          git push origin feature/weed-goblins-session-zero
