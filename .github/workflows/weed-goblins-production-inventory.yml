name: Weed Goblins production Worker inventory

on:
  push:
    branches:
      - remove-anthropic/weed-goblins-workers-ai

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 41; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING'; exit 42; }

      - name: List production Worker secret names only
        working-directory: server/weed-goblins-narration-worker
        run: npx wrangler@latest secret list

      - name: List production Worker deployments
        working-directory: server/weed-goblins-narration-worker
        run: npx wrangler@latest deployments list

      - name: Remove temporary inventory workflow
        run: |
          git rm .github/workflows/weed-goblins-production-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Weed Goblins production inventory workflow'
          git push origin HEAD:${GITHUB_REF_NAME}
