name: Temporary Phase 1 Preview Security Verify

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_BASE: https://feature-phase1-log-talk-play.my420journal-app.pages.dev
    steps:
      - name: Wait for diagnostic deployment and verify preview secret presence
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            body=$(curl --silent --show-error --max-time 10 "$PREVIEW_BASE/api/private-testing-diagnostic" || true)
            if printf '%s' "$body" | jq -e '.journal_access_code_present == true' >/dev/null 2>&1; then
              echo 'PREVIEW_JOURNAL_ACCESS_CODE_PRESENT=yes'
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo 'PREVIEW_JOURNAL_ACCESS_CODE_PRESENT=no'
            exit 1
          fi

      - name: Verify unauthenticated routes are blocked
        shell: bash
        run: |
          set -euo pipefail
          for path in / /games/weed-goblins /games/who-took-my-lighter /games/the-new-place; do
            safe=$(printf '%s' "$path" | tr '/?' '__')
            headers="/tmp/${safe}.headers"
            body="/tmp/${safe}.body"
            status=$(curl --silent --show-error --max-time 15 -D "$headers" -o "$body" -w '%{http_code}' "$PREVIEW_BASE$path")
            echo "$path status=$status"
            test "$status" = '401'
            grep -q 'Private Testing' "$body"
            grep -qi '^X-Robots-Tag:.*noindex' "$headers"
          done
          echo 'UNAUTHENTICATED_PREVIEW_BLOCKING=PASS'

      - name: Verify wrong code cannot create session
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 15 \
            -D /tmp/wrong.headers \
            -o /tmp/wrong.body \
            -w '%{http_code}' \
            -X POST \
            --data-urlencode 'access_code=definitely-not-the-valid-code' \
            "$PREVIEW_BASE/api/private-testing-access")
          echo "wrong-code status=$status"
          test "$status" = '401'
          grep -q 'That code is not valid or has expired' /tmp/wrong.body
          if grep -qi '^Set-Cookie:' /tmp/wrong.headers; then
            echo 'WRONG_CODE_SET_COOKIE=yes'
            exit 1
          fi
          echo 'WRONG_CODE_SET_COOKIE=no'
          echo 'WRONG_CODE_REJECTION=PASS'
