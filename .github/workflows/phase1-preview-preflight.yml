name: Temporary Phase 1 Preview Credential Probe

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      PAGES_API_TOKEN: ${{ secrets.PAGES_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CF_GLOBAL_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_EMAIL: ${{ secrets.CF_EMAIL }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      JOURNAL_ACCESS_CODE: ${{ secrets.JOURNAL_ACCESS_CODE }}
      MY420JOURNAL_ACCESS_CODE: ${{ secrets.MY420JOURNAL_ACCESS_CODE }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          for name in \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_PAGES_API_TOKEN PAGES_API_TOKEN \
            CLOUDFLARE_API_KEY CLOUDFLARE_GLOBAL_API_KEY CF_GLOBAL_API_KEY CF_API_KEY \
            CLOUDFLARE_EMAIL CF_EMAIL CF_API_TOKEN CF_ACCOUNT_ID \
            JOURNAL_ACCESS_CODE MY420JOURNAL_ACCESS_CODE; do
            if [ -n "${!name}" ]; then
              echo "$name=present"
            else
              echo "$name=missing"
            fi
          done
