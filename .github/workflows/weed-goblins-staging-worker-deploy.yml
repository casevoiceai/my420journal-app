name: Weed Goblins staging Worker deploy

on:
  push:
    branches:
      - temp/weed-goblins-staging-worker-deploy

jobs:
  deploy-staging:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_PROXY_SECRET: ${{ secrets.WEED_GOBLINS_STAGING_PROXY_SECRET }}
      STAGING_ANTHROPIC_API_KEY: ${{ secrets.WEED_GOBLINS_ANTHROPIC_API_KEY }}
      STAGING_RATE_LIMIT_SALT: ${{ secrets.WEED_GOBLINS_STAGING_RATE_LIMIT_SALT }}
      STAGING_WORKER_URL: https://my420journal-weed-goblins-narration-staging.casevoice-ai.workers.dev
    steps:
      - name: Check out verified feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/weed-goblins-session-zero
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require staging credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN_MISSING"
            exit 41
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID_MISSING"
            exit 42
          fi
          if [ -z "$STAGING_PROXY_SECRET" ]; then
            echo "WEED_GOBLINS_STAGING_PROXY_SECRET_MISSING"
            exit 43
          fi
          if [ -z "$STAGING_ANTHROPIC_API_KEY" ]; then
            echo "WEED_GOBLINS_ANTHROPIC_API_KEY_MISSING"
            exit 44
          fi
          if [ -z "$STAGING_RATE_LIMIT_SALT" ]; then
            echo "WEED_GOBLINS_STAGING_RATE_LIMIT_SALT_MISSING"
            exit 45
          fi
          echo "All staging credentials are present."

      - name: Set staging Worker secrets
        working-directory: server/weed-goblins-narration-worker
        shell: bash
        run: |
          printf '%s' "$STAGING_PROXY_SECRET" | npx wrangler@latest secret put WEED_GOBLINS_PROXY_SECRET --env staging
          printf '%s' "$STAGING_ANTHROPIC_API_KEY" | npx wrangler@latest secret put WEED_GOBLINS_ANTHROPIC_API_KEY --env staging
          printf '%s' "$STAGING_RATE_LIMIT_SALT" | npx wrangler@latest secret put WEED_GOBLINS_RATE_LIMIT_SALT --env staging

      - name: Deploy staging Worker only
        working-directory: server/weed-goblins-narration-worker
        run: npx wrangler@latest deploy --env staging

      - name: Smoke test staging narration
        shell: bash
        run: |
          status=$(curl --silent --show-error \
            --output /tmp/weed-goblins-staging-response.json \
            --write-out '%{http_code}' \
            --request POST "$STAGING_WORKER_URL" \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $STAGING_PROXY_SECRET" \
            --data '{"moment":"natural-one-complication","outcome":"complication","sceneId":"choose-route","actionId":"route:ridge","stat":"strength","dc":12,"rolls":[1],"selectedRoll":1,"troubleBefore":0,"troubleAfter":2,"fictionalStolenItem":"the Amber Field Satchel","fictionalGoblinName":"Professor Grub","narrationTier":"normal"}')
          if [ "$status" != "200" ]; then
            echo "STAGING_SMOKE_TEST_HTTP_$status"
            cat /tmp/weed-goblins-staging-response.json
            exit 51
          fi
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/weed-goblins-staging-response.json','utf8')); if(!j.text || typeof j.text !== 'string') process.exit(52); console.log('STAGING_SMOKE_TEST_OK')"
