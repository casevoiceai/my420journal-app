name: Weed Goblins Priority 10 Eliza GM prompt

on:
  push:
    branches:
      - temp/weed-goblins-priority10-eliza-gm
    paths:
      - .github/workflows/weed-goblins-priority10-eliza-gm.yml

permissions:
  contents: write

jobs:
  build-priority10:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out temp branch
        uses: actions/checkout@v4
        with:
          ref: temp/weed-goblins-priority10-eliza-gm
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rewrite Eliza GM prompt and prompt tests
        run: python .github/scripts/priority10_eliza_gm_rewrite.py

      - name: Verify exact code scope
        shell: bash
        run: |
          changed=$(git diff --name-only | sort)
          printf '%s\n' "$changed"
          expected=$'server/weed-goblins-narration-worker/index.js\nserver/weed-goblins-narration-worker/index.test.js'
          if [ "$changed" != "$expected" ]; then
            echo 'UNEXPECTED_SCOPE'
            exit 61
          fi

      - name: Install dependencies
        run: npm install

      - name: Run targeted narration Worker tests
        run: node --test server/weed-goblins-narration-worker/index.test.js server/weed-goblins-narration-worker/story-beats.test.js

      - name: Build production bundle
        run: npm run build

      - name: Commit verified Priority 10 code
        shell: bash
        run: |
          git config user.name 'casevoiceai'
          git config user.email 'casevoice.ai@gmail.com'
          git add server/weed-goblins-narration-worker/index.js server/weed-goblins-narration-worker/index.test.js
          git commit -m 'Rewrite Eliza GM and goblin performance prompt'
          git push origin HEAD:temp/weed-goblins-priority10-eliza-gm
