name: Weed Goblins Priority 10 clean verify

on:
  push:
    branches:
      - temp/weed-goblins-priority10-eliza-gm
    paths:
      - .github/workflows/weed-goblins-priority10-eliza-gm.yml

permissions:
  contents: write

jobs:
  verify-clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out clean branch
        uses: actions/checkout@v4
        with:
          ref: temp/weed-goblins-priority10-clean
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Git identity
        run: |
          git config user.name 'casevoiceai'
          git config user.email 'casevoice.ai@gmail.com'

      - name: Cherry-pick verified two-file code commit
        run: git cherry-pick 1e00730b8a625ebd99b9e95fed85f6c39105e949

      - name: Verify exact feature scope
        shell: bash
        run: |
          changed=$(git diff --name-only origin/feature/weed-goblins-session-zero...HEAD | sort)
          printf '%s\n' "$changed"
          expected=$'server/weed-goblins-narration-worker/index.js\nserver/weed-goblins-narration-worker/index.test.js'
          if [ "$changed" != "$expected" ]; then
            echo 'UNEXPECTED_SCOPE'
            exit 61
          fi

      - name: Install dependencies
        run: npm install

      - name: Run targeted narration Worker tests
        run: node --test server/weed-goblins-narration-worker/index.test.js server/weed-goblins-narration-worker/story-beats.test.js

      - name: Build production bundle
        run: npm run build

      - name: Push verified clean branch
        run: git push origin HEAD:temp/weed-goblins-priority10-clean
