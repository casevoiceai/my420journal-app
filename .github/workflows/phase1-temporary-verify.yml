name: Temporary Phase 1 Verify

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: read

jobs:
  verify-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test current branch
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::CURRENT: $line"
            done < <(grep '^not ok' test-output.log || true)
            echo "::error::CURRENT: npm test failed with exit code $status"
            exit "$status"
          fi
      - name: Build current branch
        if: always()
        run: npm run build

  verify-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pre-WTML baseline
        uses: actions/checkout@v4
        with:
          ref: 8b8472888d979f013a08b43aa6d0d161b59b4ce6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install baseline
        run: npm ci
      - name: Test pre-WTML baseline
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee baseline-test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::BASELINE: $line"
            done < <(grep '^not ok' baseline-test-output.log || true)
            echo "::error::BASELINE: npm test failed with exit code $status"
            exit "$status"
          fi
