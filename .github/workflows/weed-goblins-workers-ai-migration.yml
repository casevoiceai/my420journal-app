name: Weed Goblins Workers AI migration

on:
  push:
    branches:
      - remove-anthropic/weed-goblins-workers-ai

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply provider migration
        run: |
          echo '' | base64 --decode > /tmp/weed-goblins-migrate.py
          python /tmp/weed-goblins-migrate.py

      - name: Install dependencies
        run: npm ci

      - name: Run full tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Validate diff
        run: |
          git diff --check
          if git grep -niE 'anthropic|claude' -- server/weed-goblins-narration-worker; then
            echo 'Forbidden Anthropic/Claude reference remains in Weed Goblins narration Worker.'
            exit 1
          fi

      - name: Commit validated migration
        run: |
          git rm .github/workflows/weed-goblins-workers-ai-migration.yml
          git add server/weed-goblins-narration-worker/index.js \
                  server/weed-goblins-narration-worker/index.test.js \
                  server/weed-goblins-narration-worker/story-beats.test.js \
                  server/weed-goblins-narration-worker/wrangler.jsonc \
                  server/weed-goblins-narration-worker/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace Weed Goblins Anthropic narration with Workers AI'
          git push origin HEAD:${GITHUB_REF_NAME}
