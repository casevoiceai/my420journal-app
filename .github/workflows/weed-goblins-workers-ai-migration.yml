name: Weed Goblins Workers AI migration

on:
  push:
    branches:
      - remove-anthropic/weed-goblins-workers-ai

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for migration helper
        id: helper
        shell: bash
        run: |
          if [ -f .github/weed-goblins-migrate.py ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Migration helper not committed yet. This setup run is intentionally a no-op.'
          fi

      - name: Set up Node
        if: steps.helper.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply provider migration
        if: steps.helper.outputs.ready == 'true'
        run: python .github/weed-goblins-migrate.py

      - name: Install dependencies
        if: steps.helper.outputs.ready == 'true'
        run: npm ci

      - name: Run full tests
        if: steps.helper.outputs.ready == 'true'
        run: npm test

      - name: Run production build
        if: steps.helper.outputs.ready == 'true'
        run: npm run build

      - name: Validate diff
        if: steps.helper.outputs.ready == 'true'
        run: |
          git diff --check
          if git grep -niE 'anthropic|claude' -- server/weed-goblins-narration-worker; then
            echo 'Forbidden Anthropic/Claude reference remains in Weed Goblins narration Worker.'
            exit 1
          fi

      - name: Commit validated migration
        if: steps.helper.outputs.ready == 'true'
        run: |
          git rm .github/workflows/weed-goblins-workers-ai-migration.yml .github/weed-goblins-migrate.py
          git add server/weed-goblins-narration-worker/index.js \
                  server/weed-goblins-narration-worker/index.test.js \
                  server/weed-goblins-narration-worker/story-beats.test.js \
                  server/weed-goblins-narration-worker/wrangler.jsonc \
                  server/weed-goblins-narration-worker/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace Weed Goblins Anthropic narration with Workers AI'
          git push origin HEAD:${GITHUB_REF_NAME}
