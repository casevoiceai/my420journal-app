name: Remove precise geolocation

on:
  push:
    branches:
      - privacy/remove-precise-geolocation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout privacy branch
        uses: actions/checkout@v4
        with:
          ref: privacy/remove-precise-geolocation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remove precise browser geolocation request
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/screens/NewEntry.jsx')
          text = path.read_text()
          old = """function getUserCoords() {
            return new Promise((resolve) => {
              if (!navigator.geolocation) { resolve(null); return }
              navigator.geolocation.getCurrentPosition(
                (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                () => resolve(null),
                { timeout: 4000 }
              )
            })
          }
          """
          new = """function getUserCoords() {
            return Promise.resolve(null)
          }
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected precise geolocation block exactly once; found {text.count(old)}')
          path.write_text(text.replace(old, new))

          test_path = Path('src/lib/newEntryPrivacyBoundary.test.js')
          if test_path.exists():
              raise SystemExit('Privacy boundary test already exists unexpectedly')
          test_path.write_text("""import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport fs from 'node:fs'\n\nconst newEntrySource = fs.readFileSync(new URL('../screens/NewEntry.jsx', import.meta.url), 'utf8')\n\ntest('new entry does not request precise browser geolocation', () => {\n  assert.equal(newEntrySource.includes('navigator.geolocation'), false)\n  assert.equal(newEntrySource.includes('getCurrentPosition'), false)\n  assert.equal(newEntrySource.includes('pos.coords.latitude'), false)\n  assert.equal(newEntrySource.includes('pos.coords.longitude'), false)\n})\n""")

          package_path = Path('package.json')
          package_text = package_path.read_text()
          old_tests = 'src/lib/privacyMigrations.test.js src/lib/sharedAggregateProxy.test.js'
          new_tests = 'src/lib/privacyMigrations.test.js src/lib/newEntryPrivacyBoundary.test.js src/lib/sharedAggregateProxy.test.js'
          if package_text.count(old_tests) != 1:
              raise SystemExit(f'Expected package test insertion point exactly once; found {package_text.count(old_tests)}')
          package_path.write_text(package_text.replace(old_tests, new_tests))
          PY

      - name: Verify exact changed-file scope before validation
        run: |
          git diff --check
          printf '%s\n' "$(git diff --name-only | sort)"
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' package.json src/lib/newEntryPrivacyBoundary.test.js src/screens/NewEntry.jsx | sort)"
          ! grep -q 'navigator\.geolocation' src/screens/NewEntry.jsx
          ! grep -q 'getCurrentPosition' src/screens/NewEntry.jsx

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit validated correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/lib/newEntryPrivacyBoundary.test.js src/screens/NewEntry.jsx
          git commit -m 'Remove precise browser geolocation request'
          git push origin HEAD:privacy/remove-precise-geolocation
