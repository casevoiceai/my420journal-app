name: Weed Goblins Narration Rhythm Rules

on:
  push:
    branches:
      - temp/weed-goblins-narration-voice-audit-20260809
    paths:
      - .github/workflows/temp-narration-rhythm-rules.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/weed-goblins-narration-voice-audit-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify feature branch and protected engine
        shell: bash
        run: |
          git fetch origin feature/weed-goblins-session-zero
          test "$(git rev-parse origin/feature/weed-goblins-session-zero)" = "a9021d750698d2b9b211cf3227dca676fe1da11b"
          test "$(git hash-object src/features/games/weed-goblins/weedGoblinsEngine.js)" = "02b3bdc10a32687fed81e230525b418567645b6a"
      - name: Apply rhythm rules and migrate obsolete cadence assertion
        shell: bash
        run: |
          python .github/scripts/apply_narration_rhythm_rules.py
          python .github/scripts/update_narration_rhythm_test.py
      - name: Confirm locked prose rules are present
        shell: bash
        run: |
          grep -F 'One GM turn is one coherent messenger bubble' server/weed-goblins-narration-worker/legacyChapterOne.js
          grep -F 'Fragments are punctuation for dramatic effect, not the default structure.' server/weed-goblins-narration-worker/legacyChapterOne.js
          grep -F 'Use "as though" at most once in a scene.' server/weed-goblins-narration-worker/legacyChapterOne.js
          grep -F 'Do not default to lists of three.' server/weed-goblins-narration-worker/legacyChapterOne.js
      - name: Run focused narration suite
        shell: bash
        run: |
          node --test \
            server/weed-goblins-narration-worker/voice-audit.test.js \
            server/weed-goblins-narration-worker/index.test.js \
            server/weed-goblins-narration-worker/story-beats.test.js \
            src/features/games/weed-goblins/weedGoblinsAiComplication.test.js
      - name: Build
        run: npm run build
      - name: Commit rhythm-contract change
        shell: bash
        run: |
          git config user.name 'casevoiceai'
          git config user.email 'casevoice.ai@gmail.com'
          git add \
            server/weed-goblins-narration-worker/legacyChapterOne.js \
            server/weed-goblins-narration-worker/index.test.js
          git commit -m 'Tighten Eliza narration rhythm rules'
          git push origin HEAD:temp/weed-goblins-narration-voice-audit-20260809
