name: Finish geolocation removal

on:
  push:
    branches:
      - privacy/remove-precise-geolocation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout privacy branch
        uses: actions/checkout@v4
        with:
          ref: privacy/remove-precise-geolocation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remove dead location-bias plumbing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/screens/NewEntry.jsx')
          text = path.read_text()

          replacements = [
            ("""async function placesAutocomplete(input, coords, radius = 64000) {
            try {
              const body = {
                input, type: 'autocomplete',
                lat: coords?.lat ?? 41.5748,
                lng: coords?.lng ?? -75.5022,
                radius,
              }
              const response = await localStore.tools.invoke('place-lookup', { body })
          """, """async function placesAutocomplete(input) {
            try {
              const body = { input, type: 'autocomplete' }
              const response = await localStore.tools.invoke('place-lookup', { body })
          """),
            ("""function getUserCoords() {
            return Promise.resolve(null)
          }

          """, ""),
            ("""  const [coords, setCoords]           = useState(null)
            const [gpsCoords, setGpsCoords]     = useState(null)
            const [travelRadius]                = useState(64000)
          """, ""),
            ("""  // Get GPS once on mount as a soft location bias
            useEffect(() => {
              async function init() {
                const gps = await getUserCoords()
                if (gps) setGpsCoords(gps)
              }
              init()
            }, [])

            // Use GPS as soft location bias only. City text in the search query handles filtering.
            useEffect(() => { setCoords(gpsCoords) }, [gpsCoords])

          """, ""),
            ("""    const res = await placesAutocomplete(buildSearchInput(nameVal), coords, travelRadius)
          """, """    const res = await placesAutocomplete(buildSearchInput(nameVal))
          """),
            ("""  }, [nameQuery, city, stateAbbr, value, coords]) // eslint-disable-line
          """, """  }, [nameQuery, city, stateAbbr, value]) // eslint-disable-line
          """),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected cleanup block exactly once; found {count}: {old[:60]!r}')
              text = text.replace(old, new)
          path.write_text(text)

          test_path = Path('src/lib/newEntryPrivacyBoundary.test.js')
          test_text = test_path.read_text()
          old_test = """  assert.equal(newEntrySource.includes('pos.coords.longitude'), false)
          })
          """
          new_test = """  assert.equal(newEntrySource.includes('pos.coords.longitude'), false)
            assert.equal(newEntrySource.includes('getUserCoords'), false)
            assert.equal(newEntrySource.includes('gpsCoords'), false)
            assert.equal(newEntrySource.includes('travelRadius'), false)
            assert.equal(newEntrySource.includes('lat: coords'), false)
            assert.equal(newEntrySource.includes('lng: coords'), false)
          })
          """
          if test_text.count(old_test) != 1:
              raise SystemExit(f'Expected privacy test insertion point exactly once; found {test_text.count(old_test)}')
          test_path.write_text(test_text.replace(old_test, new_test))
          PY

      - name: Verify exact changed-file scope
        run: |
          git diff --check
          changed="$(git status --porcelain | cut -c4- | sort)"
          expected="$(printf '%s\n' src/lib/newEntryPrivacyBoundary.test.js src/screens/NewEntry.jsx | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          ! grep -q 'navigator\.geolocation\|getCurrentPosition\|getUserCoords\|gpsCoords\|travelRadius' src/screens/NewEntry.jsx
          ! grep -q 'lat: coords\|lng: coords' src/screens/NewEntry.jsx

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit validated cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/newEntryPrivacyBoundary.test.js src/screens/NewEntry.jsx
          git commit -m 'Remove dead geolocation bias plumbing'
          git push origin HEAD:privacy/remove-precise-geolocation
