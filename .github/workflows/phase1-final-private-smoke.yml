name: Temporary Phase 1 Final Private Smoke

on:
  push:
    branches:
      - feature/phase1-log-talk-play-integration

permissions:
  contents: write
  checks: read

jobs:
  smoke:
    if: github.event.head_commit.message == 'Run final Phase 1 private smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_BASE: https://feature-phase1-log-talk-play.my420journal-app.pages.dev
      BRANCH_NAME: feature/phase1-log-talk-play-integration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase1-log-talk-play-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Rotate to masked CI-only tester code
        shell: bash
        run: |
          set -euo pipefail
          original_hash=$(python - <<'PY'
          from pathlib import Path
          import re
          text=Path('server/phase1-preview-access.js').read_text()
          m=re.search(r"PHASE1_PREVIEW_ACCESS_CODE_SHA256 = '([0-9a-f]{64})'", text)
          if not m: raise SystemExit('Preview hash missing')
          print(m.group(1))
          PY
          )
          echo "ORIGINAL_HASH=$original_hash" >> "$GITHUB_ENV"
          raw=$(openssl rand -hex 18 | tr '[:lower:]' '[:upper:]')
          code="FINAL-${raw:0:6}-${raw:6:6}-${raw:12:6}-${raw:18:6}-${raw:24:6}-${raw:30:6}"
          echo "::add-mask::$code"
          temp_hash=$(printf '%s' "$code" | sha256sum | awk '{print $1}')
          echo "TEMP_TEST_CODE=$code" >> "$GITHUB_ENV"
          python - "$temp_hash" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('server/phase1-preview-access.js')
          text=p.read_text()
          text,count=re.subn(r"(PHASE1_PREVIEW_ACCESS_CODE_SHA256 = ')[0-9a-f]{64}(')", rf"\g<1>{sys.argv[1]}\g<2>", text, count=1)
          if count != 1: raise SystemExit('Expected one preview hash')
          p.write_text(text)
          PY
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add server/phase1-preview-access.js
          git commit -m 'Temporary final Phase 1 smoke hash'
          git push origin "HEAD:$BRANCH_NAME"
          echo "TEST_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Wait for exact Cloudflare deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            json=$(curl -sS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TEST_COMMIT/check-runs?per_page=100")
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success")' >/dev/null; then exit 0; fi
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion!="success")' >/dev/null; then exit 1; fi
            sleep 3
          done
          exit 1
      - name: Run final live private smoke
        shell: bash
        run: |
          mkdir -p final-smoke
          cat > final-smoke-run.mjs <<'NODE'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          const base=process.env.PREVIEW_BASE
          const code=process.env.TEMP_TEST_CODE
          const product='Final Phase 1 Smoke Flower'
          const results=[]
          const pageErrors=[]
          const guideNetworkRequests=[]
          const record=(test,status,detail='')=>{results.push({test,status,detail});console.log(`[${status}] ${test}${detail?` -- ${detail}`:''}`)}
          const browser=await chromium.launch({headless:true})
          const context=await browser.newContext({viewport:{width:1280,height:900}})
          const page=await context.newPage()
          page.on('pageerror',e=>pageErrors.push({url:page.url(),message:e.message}))
          try {
            const blocked=await page.goto(base,{waitUntil:'networkidle',timeout:60000})
            record('private gate rejects unauthenticated',blocked?.status()===401?'PASS':'BLOCKER',`status=${blocked?.status()}`)
            await page.getByLabel('Access code').fill(code)
            await page.getByRole('button',{name:'Continue'}).click()
            await page.waitForURL(`${base}/`,{timeout:15000})
            record('masked tester opens canonical private preview','PASS')

            await page.goto(`${base}/signup?m420test=1`,{waitUntil:'networkidle'})
            await page.getByRole('button',{name:'Create your account'}).click()
            await page.waitForURL(/\/onboarding/,{timeout:15000})
            await page.getByRole('button',{name:'Meet them'}).click()
            await page.getByRole('button',{name:/Sunny Day/}).first().click()
            await page.getByRole('button',{name:'Choose Sunny as my guide'}).click()
            await page.waitForURL(/step=location/,{timeout:10000})
            await page.getByRole('button',{name:'Skip for now'}).click()
            await page.waitForURL(/\/pin-setup/,{timeout:10000})
            await page.getByRole('button',{name:'Skip for now'}).click()
            await page.waitForURL(/\/home/,{timeout:10000})
            record('onboarding to Home works','PASS')

            await page.goto(`${base}/quick`,{waitUntil:'networkidle'})
            await page.getByPlaceholder('Product name...').fill(product)
            await page.getByRole('button',{name:'Save',exact:true}).click()
            await page.waitForURL(/\/home/,{timeout:10000})
            await page.goto(`${base}/journal`,{waitUntil:'networkidle'})
            record('LOG persists product',(await page.locator('body').innerText()).includes(product)?'PASS':'BLOCKER')

            await page.goto(`${base}/guide`,{waitUntil:'networkidle'})
            let capture=false
            page.on('request',request=>{
              if(capture){
                const url=request.url()
                if(url.includes('/api/')||/anthropic|openai|claude/i.test(url)) guideNetworkRequests.push(url)
              }
            })
            capture=true
            const input=page.getByPlaceholder('Say something...')
            await input.fill('What product did I just log?')
            await input.press('Enter')
            await page.waitForTimeout(600)
            const guideText=await page.locator('body').innerText()
            record('TALK recalls latest LOG',guideText.includes(`You just logged ${product}.`)?'PASS':'BLOCKER')
            record('TALK recall remains local',guideNetworkRequests.length===0?'PASS':'BLOCKER',guideNetworkRequests.join(', '))

            for (const [path,title] of [
              ['/games/weed-goblins','Eliza'],
              ['/games/who-took-my-lighter','Who Took My Lighter?'],
              ['/games/the-new-place','The New Place'],
            ]) {
              await page.goto(base+path,{waitUntil:'networkidle',timeout:30000})
              const text=await page.locator('body').innerText()
              record(`PLAY entry ${path} renders`,text.includes(title)?'PASS':'BLOCKER',page.url())
            }

            for (const path of ['/journal','/guide','/settings']) {
              await page.goto(base+path,{waitUntil:'networkidle',timeout:30000})
              record(`core route ${path} renders`,(await page.locator('body').innerText()).trim().length>40?'PASS':'BLOCKER')
            }
            await page.screenshot({path:'final-smoke/final.png',fullPage:true})
          } catch(error) {
            record('final live private smoke','HARNESS-OR-PRODUCT-FAIL',error.message)
            await page.screenshot({path:'final-smoke/failure.png',fullPage:true}).catch(()=>{})
          }
          const report={results,pageErrors,guideNetworkRequests,finishedAt:new Date().toISOString()}
          fs.writeFileSync('final-smoke/report.json',JSON.stringify(report,null,2))
          console.log('FINAL_SMOKE_REPORT='+JSON.stringify(report))
          if (results.some(r=>r.status!=='PASS') || pageErrors.length) process.exitCode=1
          await browser.close()
          NODE
          node ./final-smoke-run.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-final-private-smoke
          path: final-smoke/
          retention-days: 7
      - name: Restore founder access and remove workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"
          test -n "${ORIGINAL_HASH:-}"
          python - "$ORIGINAL_HASH" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('server/phase1-preview-access.js')
          text=p.read_text()
          text,count=re.subn(r"(PHASE1_PREVIEW_ACCESS_CODE_SHA256 = ')[0-9a-f]{64}(')", rf"\g<1>{sys.argv[1]}\g<2>", text, count=1)
          if count != 1: raise SystemExit('Expected one preview hash')
          p.write_text(text)
          PY
          git rm -f .github/workflows/phase1-final-private-smoke.yml
          git config user.name casevoiceai
          git config user.email casevoice.ai@gmail.com
          git add server/phase1-preview-access.js
          git commit -m 'Restore founder access after final Phase 1 smoke'
          git push origin "HEAD:$BRANCH_NAME"
          echo "RESTORE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify restored founder deployment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${RESTORE_COMMIT:-}"
          for attempt in $(seq 1 100); do
            json=$(curl -sS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$RESTORE_COMMIT/check-runs?per_page=100")
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success")' >/dev/null; then exit 0; fi
            if printf '%s' "$json" | jq -e '.check_runs[]? | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion!="success")' >/dev/null; then exit 1; fi
            sleep 3
          done
          exit 1
