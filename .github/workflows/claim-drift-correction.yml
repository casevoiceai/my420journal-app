name: Privacy claim correction

on:
  push:
    branches:
      - privacy/claim-drift-corrections

permissions:
  contents: write

jobs:
  patch-validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout claim-drift branch
        uses: actions/checkout@v4
        with:
          ref: privacy/claim-drift-corrections
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply exact factual-copy corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_count(pathname, old, new, expected=1):
              path = Path(pathname)
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{pathname}: expected {expected} occurrence(s), found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new))

          replace_count('src/marketing/MarketingHero.jsx', 'Log what you tried. See what actually worked.', 'Log what you tried. See what your own notes show.')
          replace_count('src/marketing/MarketingHero.jsx', 'Nothing leaves your device unless you choose to share it.', 'Your private journal is stored locally in this browser.')

          replace_count('src/marketing/MarketingFeatures.jsx', "title: 'Scan any label'", "title: 'Log the details'")
          replace_count('src/marketing/MarketingFeatures.jsx', 'Point your camera at any label and let it capture the details.', 'Record the product, amount, method, and details you care about.', 2)
          replace_count('src/marketing/MarketingFeatures.jsx', 'It reads the strain, dose, and method automatically.', 'Manual entry is available now in the current private-testing build.', 2)
          replace_count('src/marketing/MarketingFeatures.jsx', 'No manual typing, no guessing at what you jotted down later.', 'Camera label scanning is not available yet.', 2)
          replace_count('src/marketing/MarketingFeatures.jsx', "title: 'Log by voice'", "title: 'Draft by voice'")
          replace_count('src/marketing/MarketingFeatures.jsx', 'Say what happened out loud and let it become the entry.', 'On supported browsers, speak a draft instead of typing it.', 2)
          replace_count('src/marketing/MarketingFeatures.jsx', 'Your words get logged exactly as spoken, hands free.', 'Review or edit the transcript before you save the entry.', 2)
          replace_count('src/marketing/MarketingFeatures.jsx', "No typing, no forms, no digging for your phone's keyboard.", 'Speech recognition is provided by your browser and can vary by browser or device.', 2)
          replace_count('src/marketing/MarketingFeatures.jsx', "title: 'Nothing stored without your choice'", "title: 'Keep control of your journal'")
          replace_count('src/marketing/MarketingFeatures.jsx', 'Nothing saves anywhere until you decide it should.', 'Journal entries are stored in browser local storage on this device.', 2)
          replace_count('src/marketing/MarketingFeatures.jsx', "You control exactly what gets kept and what doesn't.", 'You can delete entries from this browser when you choose.', 2)
          replace_count('src/marketing/MarketingFeatures.jsx', 'Delete any entry, any time. No trace, ever.', 'Downloaded backup files are separate copies that stay under your control.', 2)

          privacy_anchor = "  {\n    heading: 'LOCAL PROFILE — NO EMAIL OR PASSWORD REQUIRED',"
          network_section = (
              "  {\n"
              "    heading: 'OPTIONAL NETWORK FEATURES',\n"
              "    paragraphs: [\n"
              "      'The private journal is local-first, but not every optional feature is offline. Weed Goblins uses a same-origin server path and Cloudflare Workers AI to generate game narration when a tester chooses to play.',\n"
              "      'When Weed Goblins is used, the app can derive limited structured game context from local journal history, including product-derived game labels, product categories, effect tags, terpene labels, fictionalized dispensary labels, entry count, and prior game-run summaries. The game adapter excludes raw journal notes and raw dispensary names from that context. Player-entered game text can also be included in narration requests.',\n"
              "      'The game request reaches server-side and Cloudflare infrastructure. Source IP information is processed for request security and rate limiting; the narration worker derives a salted source key for its in-memory limiter rather than retaining the raw IP in that limiter.',\n"
              "      'Voice entry uses the browser SpeechRecognition implementation when the browser provides it. Speech-processing behavior depends on the browser and platform and is not represented as device-only. The transcript can be reviewed or edited before it is saved to the local journal.',\n"
              "    ],\n"
              "  },\n"
          )
          replace_count('src/marketing/MarketingPrivacy.jsx', privacy_anchor, network_section + privacy_anchor)
          replace_count(
              'src/marketing/MarketingPrivacy.jsx',
              'The current private-testing age flow is being revised into a market-specific age-assurance system. My420Journal does not currently require Vogtcom to store a government ID image as part of the private journal.',
              'In the current private-testing build, My420Journal asks for coarse residence information — country and, for reviewed U.S. markets, state — to select a versioned market configuration and stores an age-confirmation result rather than an exact date of birth. The market and age flow does not request a street address, government ID image, or precise device GPS.',
          )
          controls_old = "      'Users can delete journal entries through the app. Because the private journal is local-first, clearing browser site data can also remove local journal data.',\n      'A PIN can be used as an additional in-app privacy control. A PIN does not replace device security and does not make data immune from device-level access.',"
          controls_new = "      'Users can delete journal entries through the app. Because the private journal is local-first, clearing browser site data can also remove local journal data.',\n      'Users can export and import a local JSON backup. A downloaded backup is a separate copy controlled by the user and is not removed when an in-app entry is deleted.',\n      'A PIN can be used as an additional in-app privacy control. A PIN does not replace device security and does not make data immune from device-level access.',"
          replace_count('src/marketing/MarketingPrivacy.jsx', controls_old, controls_new)

          faq_anchor = "  {\n    question: 'Is Shared Journey available?',"
          network_faq = (
              "  {\n"
              "    question: 'Does My420Journal use the internet?',\n"
              "    answer: 'The private journal is stored locally and is not cloud-synced, but some optional features use network services. Weed Goblins sends limited game and narration context, including certain structured context derived from the local journal, through a server-side Cloudflare Workers AI path when you play. Browser voice input uses the browser speech-recognition implementation, whose processing depends on the browser and platform. Shared Journey remains off.',\n"
              "  },\n"
          )
          replace_count('src/marketing/MarketingFAQ.jsx', faq_anchor, network_faq + faq_anchor)

          readme_old = '- Shared Journey / Layer 2 is disabled pending redesign and review.\n- No backup or cross-device sync is included in this build.'
          readme_new = (
              '- Shared Journey / Layer 2 is disabled pending redesign and review.\n'
              '- Local JSON backup export/import is included. No cloud backup or cross-device sync is included.\n'
              '- Weed Goblins is an optional network feature that uses a same-origin server proxy and Cloudflare Workers AI for narration. Its local adapter excludes raw journal notes and raw dispensary names, but limited structured or game-derived context can be sent when the game is used.\n'
              '- Voice entry uses browser SpeechRecognition when available. Processing behavior depends on the browser/platform and is not guaranteed to be device-only.'
          )
          replace_count('README.md', readme_old, readme_new)

          replace_count('src/screens/Settings.jsx', 'Dispensary deals and trip planning.', 'Dispensary history and trip recall.')
          replace_count('src/screens/Settings.jsx', 'Everything in this app stays on this device only.', 'Your journal entries and private notes are stored in this browser on this device.')
          replace_count('src/screens/Settings.jsx', 'No data was sent to any server.', 'This backup was created from local browser storage; the backup tool did not upload it to a journal server.')
          replace_count('src/screens/Settings.jsx', 'No account exists on any server.', 'The private journal uses an anonymous local profile, not an email/password cloud account.')
          replace_count('src/screens/Settings.jsx', 'The only copy of your journal is on this device.', 'The downloaded backup is now a separate copy under your control.')
          replace_count('src/screens/Settings.jsx', '<SectionHeading>Account</SectionHeading>', '<SectionHeading>Local profile</SectionHeading>')
          replace_count('src/screens/Settings.jsx', 'More account settings coming soon.', 'This journal uses an anonymous local profile on this device. There is no email/password cloud account or cross-device sync.')

          bud_replacements = [
              ("Let's make every trip count.", "Let's make every trip easier to remember."),
              ('Bud has spent years on the other side of the counter and now he is on yours. He knows the menus, the prices, and exactly how to get you the most for what you spend. With Bud, you stop guessing and start shopping with a plan.', 'Bud is the guide for keeping your dispensary and product history organized. He helps you look back at what you picked up, where it came from, and what your own journal says about past experiences. With Bud, the next trip starts with your own record instead of memory alone.'),
              ('DISPENSARY AND DEALS', 'DISPENSARY HISTORY'),
              ('Tracks dispensary prices and deals near you', 'Keeps your dispensary and product history organized'),
              ('Remembers what worked and what to avoid', 'Keeps your own notes about each product easy to review'),
              ('Helps you plan every trip before you go', 'Helps you review your past entries before the next trip'),
              ('Good choice. I am going to learn your preferences fast, keep an eye on prices, and make sure every trip counts. Ready when you are.', 'Good choice. I will help keep your dispensary and product history organized so your own notes are easy to check before the next trip. Ready when you are.'),
          ]
          for old, new in bud_replacements:
              replace_count('src/screens/Onboarding.jsx', old, new)

          replace_count('src/screens/NewEntry.jsx', 'Speak it, scan it, or type it.', 'Speak it or type it. Camera scanning is not available yet.')

          test_path = Path('src/lib/privacyClaims.test.js')
          if test_path.exists():
              raise SystemExit('src/lib/privacyClaims.test.js already exists unexpectedly')
          test_path.write_text(dedent("""\
          import test from 'node:test'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'

          function read(relativePath) {
            return fs.readFileSync(new URL(relativePath, import.meta.url), 'utf8')
          }

          const hero = read('../marketing/MarketingHero.jsx')
          const features = read('../marketing/MarketingFeatures.jsx')
          const privacy = read('../marketing/MarketingPrivacy.jsx')
          const faq = read('../marketing/MarketingFAQ.jsx')
          const settings = read('../screens/Settings.jsx')
          const onboarding = read('../screens/Onboarding.jsx')
          const newEntry = read('../screens/NewEntry.jsx')
          const readme = read('../../README.md')
          const allClaims = [hero, features, privacy, faq, settings, onboarding, newEntry, readme].join(String.fromCharCode(10))

          const bannedClaims = [
            'Nothing leaves your device unless you choose to share it.',
            'Scan any label',
            'It reads the strain, dose, and method automatically.',
            'logged exactly as spoken',
            'No trace, ever.',
            'Everything in this app stays on this device only.',
            'No data was sent to any server.',
            'The only copy of your journal is on this device.',
            'Dispensary deals and trip planning.',
            'Tracks dispensary prices and deals near you',
            'keep an eye on prices',
            'No backup or cross-device sync is included in this build.',
          ]

          test('retired absolute and unimplemented feature claims do not return', () => {
            for (const claim of bannedClaims) {
              assert.equal(allClaims.includes(claim), false, `retired claim returned: ${claim}`)
            }
          })

          test('current disclosures describe the implemented privacy boundaries', () => {
            assert.equal(privacy.includes("heading: 'OPTIONAL NETWORK FEATURES'"), true)
            assert.equal(privacy.includes('Shared Journey / Layer 2 is currently OFF.'), true)
            assert.equal(privacy.includes('precise device GPS'), true)
            assert.equal(features.includes('Camera label scanning is not available yet.'), true)
            assert.equal(readme.includes('Local JSON backup export/import is included.'), true)
            assert.equal(settings.includes('anonymous local profile'), true)
            assert.equal(onboarding.includes("tag: 'DISPENSARY HISTORY'"), true)
            assert.equal(newEntry.includes('Camera scanning is not available yet.'), true)
          })
          """))

          package_path = Path('package.json')
          package_text = package_path.read_text()
          old_tests = 'src/lib/newEntryPrivacyBoundary.test.js src/lib/sharedAggregateProxy.test.js'
          new_tests = 'src/lib/newEntryPrivacyBoundary.test.js src/lib/privacyClaims.test.js src/lib/sharedAggregateProxy.test.js'
          if package_text.count(old_tests) != 1:
              raise SystemExit(f'package.json: expected test insertion point once, found {package_text.count(old_tests)}')
          package_path.write_text(package_text.replace(old_tests, new_tests))
          PY

      - name: Verify exact changed-file scope
        run: |
          git diff --check
          changed="$(git status --porcelain | cut -c4- | sort)"
          expected="$(printf '%s\n' README.md package.json src/lib/privacyClaims.test.js src/marketing/MarketingFAQ.jsx src/marketing/MarketingFeatures.jsx src/marketing/MarketingHero.jsx src/marketing/MarketingPrivacy.jsx src/screens/NewEntry.jsx src/screens/Onboarding.jsx src/screens/Settings.jsx | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Guard retired claims before running suite
        run: |
          ! grep -R --exclude='privacyClaims.test.js' -F 'Nothing leaves your device unless you choose to share it.' src README.md
          ! grep -R --exclude='privacyClaims.test.js' -F 'No trace, ever.' src README.md
          ! grep -R --exclude='privacyClaims.test.js' -F 'Tracks dispensary prices and deals near you' src README.md
          ! grep -R --exclude='privacyClaims.test.js' -F 'Everything in this app stays on this device only.' src README.md
          ! grep -R --exclude='privacyClaims.test.js' -F 'No data was sent to any server.' src README.md

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit validated claim corrections and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md package.json src/lib/privacyClaims.test.js src/marketing/MarketingFAQ.jsx src/marketing/MarketingFeatures.jsx src/marketing/MarketingHero.jsx src/marketing/MarketingPrivacy.jsx src/screens/NewEntry.jsx src/screens/Onboarding.jsx src/screens/Settings.jsx
          git rm .github/workflows/claim-drift-correction.yml
          git commit -m 'Correct privacy and feature claim drift'
          git push origin HEAD:privacy/claim-drift-corrections
