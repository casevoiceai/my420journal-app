name: Cloudflare Lockdown Probe

on:
  push:
    branches:
      - 'agent/cloudflare-deploy-2026-08-10'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && echo 'CLOUDFLARE_API_TOKEN=present' || echo 'CLOUDFLARE_API_TOKEN=missing'
          test -n "$CLOUDFLARE_ACCOUNT_ID" && echo 'CLOUDFLARE_ACCOUNT_ID=present' || echo 'CLOUDFLARE_ACCOUNT_ID=missing'
          test -n "$CF_API_TOKEN" && echo 'CF_API_TOKEN=present' || echo 'CF_API_TOKEN=missing'
          test -n "$CF_ACCOUNT_ID" && echo 'CF_ACCOUNT_ID=present' || echo 'CF_ACCOUNT_ID=missing'
      - name: Read current Shared Journey remote bindings
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/my420journal-shared-worker/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq '{success, bindings: (.result.bindings // [] | map({name, type, namespace_id, id}))}'
