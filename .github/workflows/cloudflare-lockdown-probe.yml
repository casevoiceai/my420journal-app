name: Cloudflare Lockdown Probe

on:
  push:
    branches:
      - 'agent/cloudflare-deploy-2026-08-10'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WEED_GOBLINS_PROXY_SECRET: ${{ secrets.WEED_GOBLINS_PROXY_SECRET }}
      JOURNAL_SHARED_PROXY_SECRET: ${{ secrets.JOURNAL_SHARED_PROXY_SECRET }}
      JOURNAL_ACCESS_CODE: ${{ secrets.JOURNAL_ACCESS_CODE }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          test -n "$WEED_GOBLINS_PROXY_SECRET" && echo 'WEED_GOBLINS_PROXY_SECRET=present' || echo 'WEED_GOBLINS_PROXY_SECRET=missing'
          test -n "$JOURNAL_SHARED_PROXY_SECRET" && echo 'JOURNAL_SHARED_PROXY_SECRET=present' || echo 'JOURNAL_SHARED_PROXY_SECRET=missing'
          test -n "$JOURNAL_ACCESS_CODE" && echo 'JOURNAL_ACCESS_CODE=present' || echo 'JOURNAL_ACCESS_CODE=missing'
      - name: Confirm current Shared Journey D1 binding
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/my420journal-shared-worker/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -e '.success and any(.result.bindings[]; .name == "DB" and .type == "d1" and .id == "72afe7f1-d3cb-4741-8d02-a1fedd728644")' >/dev/null
          echo 'shared_d1_baseline=confirmed'
