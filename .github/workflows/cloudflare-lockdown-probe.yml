name: Cloudflare Lockdown Probe

on:
  push:
    branches:
      - 'agent/cloudflare-deploy-2026-08-10'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read current Shared Journey remote bindings
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/my420journal-shared-worker/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq '{success, bindings: (.result.bindings // [] | map({name, type, namespace_id, id}))}'
      - name: Read current anthropic-proxy remote bindings
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/anthropic-proxy/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq '{success, bindings: (.result.bindings // [] | map({name, type, namespace_id, id}))}'
      - name: List Pages projects by name only
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq '{success, projects: (.result // [] | map({name, production_branch, subdomain}))}'
